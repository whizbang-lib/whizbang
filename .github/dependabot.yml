version: 2
updates:
  # .NET NuGet dependencies
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "17:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Grouped by family rather than one pull request per package. Ungrouped, a single Friday
    # produced fourteen pull requests, and this repository runs a full matrix per pull request --
    # six suites, five Postgres shards and the quality gate -- so the cost of reviewing a version
    # string was paid fourteen times over.
    #
    # Families rather than one group for everything, because a blocked member must not block the
    # rest: the Aspire bumps require the Microsoft.Extensions line to move with them, while Dapper
    # and the tooling bumps are independent and can land the same day.
    groups:
      aspire:
        patterns:
          - "Aspire.*"
      azure-sdk:
        patterns:
          - "Azure.*"
          - "Microsoft.Azure.*"
      microsoft-platform:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Data.*"
          - "System.Text.Json"
      dev-tooling:
        patterns:
          - "*Analyzer*"
          - "*analyzers*"
          - "TUnit*"
          - "Rocks*"
          - "Microsoft.Testing*"
          - "BenchmarkDotNet*"
          - "dotnet-*"
      remaining:
        patterns:
          - "*"
    # Never propose a new major version of the .NET runtime line. Moving from one .NET major to the
    # next changes the target framework and is done deliberately, in its own pull request. Proposed
    # here, 11.0.0 packages land on a project that still targets net10.0 and the build fails, which
    # also holds back the 10.0.x patches grouped with them. Patch and minor updates still flow.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
      # Npgsql's EF Core provider tracks EF Core's major (11.x needs EF Core 11, net11.0 only), but its
      # updates come through the remaining group, which the patterns above don't cover.
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
    assignees:
      - "philcarbone"
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "17:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    # One pull request for every action. An action bump changes a pinned sha in a workflow and
    # cannot break one suite without breaking all of them, so there is nothing to isolate.
    groups:
      github-actions:
        patterns:
          - "*"
    assignees:
      - "philcarbone"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
