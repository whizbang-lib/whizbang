name: 'Setup .NET with Retry'
description: 'Installs .NET SDK with retry logic to handle transient network failures'

inputs:
  dotnet-version:
    description: '.NET SDK version to install (e.g., "10.0.x", "9.0.x")'
    required: false
    default: '10.0.x'
  max-attempts:
    description: 'Maximum number of retry attempts'
    required: false
    default: '3'
  retry-wait-seconds:
    description: 'Seconds to wait between retry attempts'
    required: false
    default: '30'

runs:
  using: 'composite'
  steps:
    - name: Setup .NET (with retry)
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 5
        max_attempts: ${{ inputs.max-attempts }}
        retry_wait_seconds: ${{ inputs.retry-wait-seconds }}
        shell: bash
        command: |
          # Installs global.json's SDK feature band (or the dotnet-version input when global.json names none),
          # checking each step: a failed download or install fails with an ::error:: naming its cause instead of
          # surfacing later as exit 127 from a missing dotnet (#1773). Adds the SDK to PATH and sets DOTNET_ROOT.
          pwsh -NoProfile -File "${{ github.action_path }}/../../scripts/Install-DotnetSdk.ps1" -FallbackChannel "${{ inputs.dotnet-version }}"
