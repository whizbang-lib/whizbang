name: Quality (Reusable)

# The second half of the quality gate: coverage merge, the coverage gates, SonarScanner end and the PR
# comment. The first half, reusable-quality-build.yml, begins the scan and runs the Sonar-wrapped build
# while the suites run, off their critical path, and hands over its analysis state. ci.yml starts this
# half only once every suite of the run has finished (a job dependency), so no runner sits waiting for
# them: until #2068 one job did both halves and held its runner polling for the suites' coverage.
#
# Where the scanner does not run (develop and release-branch pushes, the merge queue), there is no first
# half: the coverage merge reads the suites' reports and the checkout, never build output.
#
# The caller must grant `actions: read` (the artifact and job listing) in addition to `contents: read`.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Where the job runs, as JSON: a label ("ubuntu-latest") or a label set (["self-hosted","whizbang","Linux","X64"]).
          CI passes the runner picker's choice (.github/scripts/Select-CiRunner.ps1); every other caller gets ubuntu-latest.
        type: string
        required: false
        default: '"ubuntu-latest"'
      coverage-run-id:
        description: >-
          Run whose suites produced the coverage to analyze, when this run's suites yielded to it
          (a release PR's push run, or the release-branch run behind a main push). Empty: this run.
          That run may still be running (a release PR's push run starts alongside it), so this is the
          one case that still waits for coverage: a job dependency cannot name another run's jobs.
        type: string
        required: false
        default: ''
      sonar:
        description: >-
          True where Analyze · Quality build began a scan to end here: a pull-request analysis (a PR run, or a
          merge-queue leg) or main. False elsewhere (develop and release-branch pushes).
        type: boolean
        required: false
        default: false
      pull-request:
        description: >-
          The pull request this gate reports to (comment, findings, failure). Empty: no pull request (a push).
        type: string
        required: false
        default: ''
      pull-request-head:
        description: The pull request's head branch (a merge-queue leg re-points the scan at it).
        type: string
        required: false
        default: ''
      checked-sha:
        description: The commit the comment says was checked (the PR head, or the queue group's commit).
        type: string
        required: false
        default: ''
      pull-request-sha:
        description: >-
          The pull request's head commit, which the comment's findings block names so
          scripts/Invoke-PrReviewDraft.ps1 drafts it on the head (a block naming another commit reads as stale).
        type: string
        required: false
        default: ''
      diff-base:
        description: >-
          What new code is measured against: a branch name (a PR run: its base branch, fetched here) or a
          commit (a merge-queue leg: the queue base, already in the full-history checkout).
        type: string
        required: false
        default: ''
      queue-group:
        description: >-
          True on a merge-queue leg (#2070): the coverage and Sonar findings are the whole group's, so only
          those in files this pull request changed are reported to it and fail it, and the scan is re-pointed
          at this pull request before it ends. The library-wide gap is reported to every pull request.
        type: boolean
        required: false
        default: false
      upload-coverage:
        description: Upload the merged coverage to Codecov (one leg of a merge-queue group does, not each).
        type: boolean
        required: false
        default: true
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud token"
        required: true
      CODECOV_TOKEN:
        description: "Codecov token"
        required: true

# The repository default is read-only; stated here so no job can silently gain more.
permissions:
  contents: read

jobs:
  quality:
    name: Sonar and coverage
    runs-on: ${{ fromJSON(inputs.runs-on || '"ubuntu-latest"') }}
    # pull-requests: write lets the uncovered-new-lines gate comment on the PR; the caller must grant it too.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    # Minutes of work once the suites are done. The budget stays wide for the one case that still waits:
    # a release PR whose suites run in its release-branch push run (coverage-run-id), queued behind
    # runners for most of an hour at worst (a 60-minute budget once canceled a required check while
    # every suite was still green).
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for SonarCloud

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-retry
        with:
          dotnet-version: '10.0.x'

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # The first half's analysis state: only where the scanner runs. Missing state on such a run fails here,
      # so a scan can never end without the build it analyzes.
      - name: Download the analysis state
        if: inputs.sonar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-state-${{ github.run_id }}
          path: ${{ runner.temp }}/sonar-state

      # The state names this checkout's files by absolute path, some inside binary reports that cannot be
      # rewritten, so the scan ends at the same path it began at. Both halves run on the same runner class
      # (GitHub-hosted runners all check out at the same path); a different path is linked to this
      # checkout, and the job fails, naming both paths, if even that is not possible.
      - name: Restore the analysis state
        if: inputs.sonar
        env:
          STATE: ${{ runner.temp }}/sonar-state
        run: |
          set -euo pipefail
          tar -xzf "$STATE/sonarqube.tgz"
          BEGAN=$(cat "$STATE/workspace.txt")
          if [ "$BEGAN" != "$GITHUB_WORKSPACE" ]; then
            if [ -e "$BEGAN" ]; then
              echo "::error::The scan began in $BEGAN, which exists on this runner and is not this checkout ($GITHUB_WORKSPACE); the analysis state cannot be restored."
              exit 1
            fi
            { mkdir -p "$(dirname "$BEGAN")" && ln -s "$GITHUB_WORKSPACE" "$BEGAN"; } 2>/dev/null \
              || { sudo -n mkdir -p "$(dirname "$BEGAN")" && sudo -n ln -s "$GITHUB_WORKSPACE" "$BEGAN"; } \
              || { echo "::error::The scan began in $BEGAN and this checkout is $GITHUB_WORKSPACE; could not link the two. Run both quality jobs on the same runner class."; exit 1; }
            echo "Linked $BEGAN to this checkout."
          fi
          echo "SONARSCANNER_VERSION=$(cat "$STATE/sonarscanner-version.txt")" >> "$GITHUB_ENV"
          echo "Restored the analysis state begun in $BEGAN with dotnet-sonarscanner $(cat "$STATE/sonarscanner-version.txt")."

      # One build of a merge-queue group serves every pull request in it: the scan began as the group's
      # first pull request's analysis, and this leg reports it as its own (Set-SonarPullRequest.ps1).
      - name: Point the analysis at this pull request
        if: inputs.sonar && inputs.queue-group
        env:
          PR: ${{ inputs.pull-request }}
          HEAD_REF: ${{ inputs.pull-request-head }}
        run: pwsh -NoProfile -File .github/scripts/Set-SonarPullRequest.ps1 -ConfigPath .sonarqube/conf/SonarQubeAnalysisConfig.xml -Key "$PR" -Branch "$HEAD_REF"

      - name: Install tools
        run: |
          # The version the scan began with; none is pinned where the scanner does not run.
          if [ -n "${SONARSCANNER_VERSION:-}" ]; then
            dotnet tool install --global dotnet-sonarscanner --version "$SONARSCANNER_VERSION"
          fi
          dotnet tool install --global dotnet-reportgenerator-globaltool
          # Reads the suites' binary coverage reports; the version is the one Find-UncoveredNewLines.ps1 names.
          dotnet tool install --global dotnet-coverage --version 18.12.0

      - name: Wait for test suites to publish coverage
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.coverage-run-id || github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          # The expected coverage count is DERIVED, never configured: every suite leg is a job named
          # "Test · <suite> / Run suite" and uploads exactly one coverage-* artifact. All suites need only
          # Build, so once Build succeeds every leg exists in the jobs list (queued or not), and the
          # leg count is final. A hardcoded count hung this step forever after a reshard.
          # Ends on job STATE, not a poll budget: runner queueing can delay suites for most of an
          # hour, and the job-level timeout is the only backstop.
          SUITE='(.name | test("^Test · .* / Run suite$"))'
          # A SKIPPED reusable-workflow job reports under its PARENT name only ("Test · RabbitMQ"),
          # with no " / child" part, so SUITE cannot see it: match the bare parent too.
          SKIPPED_SUITE='(.conclusion == "skipped" and (.name | test("^Test · [^/]*$")))'
          GRACE=0
          while :; do
            if ! JOBS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100"); then
              echo "::warning::Could not list jobs for run $RUN_ID; retrying"
              sleep 30; continue
            fi
            BUILD=$(jq -r '[.jobs[] | select(.name | startswith("Build · Compile")) | .conclusion // "pending"] | first // "pending"' <<< "$JOBS")
            # A run that REUSED already-tested results (queue-validated: a develop push, or a release
            # cut from a tested develop commit) skips its suites on purpose and republishes the
            # tested run's coverage as coverage-republished. Absent or skipped = a normal run.
            REPUB=$(jq -r '[.jobs[] | select(.name == "Report · Republish the tested run'"'"'s coverage") | .conclusion // "pending"] | first // "absent"' <<< "$JOBS")
            if [ "$REPUB" != absent ] && [ "$REPUB" != skipped ]; then
              case "$REPUB" in
                success)
                  COUNT=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
                    --jq '[.artifacts[].name | select(startswith("coverage-"))] | length' || echo 0)
                  if [ "$COUNT" -ge 1 ]; then
                    echo "Run $RUN_ID reused already-tested results; its republished coverage is present."
                    exit 0
                  fi
                  GRACE=$((GRACE + 1))
                  if [ "$GRACE" -gt 4 ]; then
                    echo "::error::Run $RUN_ID republished its tested run's reports but holds no coverage-* artifact."
                    exit 1
                  fi ;;
                failure|cancelled)
                  echo "::error::Run $RUN_ID reused already-tested results but failed to republish their coverage."
                  exit 1 ;;
              esac
              echo "Run $RUN_ID reuses already-tested results; waiting for its republished coverage — sleeping 30s"
              sleep 30; continue
            fi
            # Fail fast when coverage will never arrive: a suite that failed, was canceled, or was
            # SKIPPED (e.g. its build dependency failed), or a failed build job itself.
            DEAD=$(jq "[.jobs[] | select(($SUITE and (.conclusion == \"failure\" or .conclusion == \"cancelled\" or .conclusion == \"skipped\")) or $SKIPPED_SUITE)] | length" <<< "$JOBS")
            if [ "$BUILD" = failure ] || [ "$BUILD" = cancelled ] || [ "$DEAD" -gt 0 ]; then
              echo "::error::Build is '$BUILD' and $DEAD suite job(s) failed, were canceled, or were skipped — coverage will never arrive; aborting quality analysis."
              exit 1
            fi
            if [ "$BUILD" != success ]; then
              echo "Build is '$BUILD'; suites not started yet — sleeping 30s"
              sleep 30; continue
            fi

            EXPECTED=$(jq "[.jobs[] | select($SUITE)] | length" <<< "$JOBS")
            DONE=$(jq "[.jobs[] | select($SUITE and .conclusion == \"success\")] | length" <<< "$JOBS")
            COUNT=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[].name | select(startswith("coverage-"))] | length' || echo 0)
            if [ "$DONE" -eq "$EXPECTED" ]; then
              if [ "$EXPECTED" -gt 0 ] && [ "$COUNT" -ge "$EXPECTED" ]; then
                echo "All $EXPECTED suites green; $COUNT coverage artifacts present."
                exit 0
              fi
              # Every suite finished green but an artifact is missing: allow a short grace for
              # listing lag, then fail loudly instead of hanging.
              GRACE=$((GRACE + 1))
              if [ "$GRACE" -gt 4 ]; then
                echo "::error::$EXPECTED suite legs finished green but only $COUNT coverage-* artifacts exist. A suite leg stopped uploading coverage, or the suite job naming changed (legs must be named 'Test · <suite> / Run suite')."
                exit 1
              fi
            fi
            echo "$DONE/$EXPECTED suites green, $COUNT coverage artifacts present — sleeping 30s"
            sleep 30
          done

      - name: Download All Coverage Artifacts
        if: inputs.coverage-run-id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Download Coverage from the Covering Run
        if: inputs.coverage-run-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
          run-id: ${{ inputs.coverage-run-id }}
          github-token: ${{ github.token }}

      - name: List Downloaded Coverage Files
        run: |
          echo "=== Downloaded coverage files ==="
          find coverage -name "*.cobertura.xml" -o -name "*.xml" 2>/dev/null || echo "No coverage files found"
          ls -laR coverage/ || echo "Coverage directory empty or missing"

      - name: Upload Merged Coverage to Codecov
        if: inputs.upload-coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          files: '**/*.cobertura.xml'
          fail_ci_if_error: false
          flags: alltests
          name: codecov-merged

      - name: Check Coverage Files
        id: check-coverage
        run: |
          # Find all cobertura XML files
          COVERAGE_FILES=$(find coverage -name "*.cobertura.xml" 2>/dev/null | tr '\n' ';')

          if [ -z "$COVERAGE_FILES" ]; then
            echo "::error::No coverage files found - this should not happen"
            echo "Coverage files are required for quality analysis"
            exit 1
          fi

          echo "Found coverage files: $COVERAGE_FILES"
          echo "files=$COVERAGE_FILES" >> "$GITHUB_OUTPUT"

      # ---- One merge for every consumer -------------------------------------------------------------
      # Each test process writes its own Cobertura report, and a report line records how many outcomes
      # of a decision that process took, not which. Taking the best count per line therefore reads a
      # decision whose outcomes ran in different processes (a unit suite and an integration shard) as
      # half covered. The suites also upload the binary report beside each Cobertura one; its block
      # hits merge exactly, and Find-UncoveredNewLines.ps1 uses them to count such a decision as covered
      # when every block of its function ran, or every block of its own statement ran and the
      # statement only branches within itself, as a ?. or ?? does (Merge-BlockCoverage explains why
      # both are exact). The merged report it writes is what ReportGenerator turns into Sonar's
      # coverage, so Sonar, the new-code gate and the whole-library row count the same outcomes.
      #
      # On a pull request the same run lists the uncovered new lines and new hand-written branches:
      # a new line counts as uncovered when no test ran it; a new hand-written decision (if, ?:, ??, ?.,
      # &&, ||, switch arms, when, catch, loops, is-patterns) counts as an uncovered branch when some
      # outcome of it was never taken. Compiler-generated branches (await state machines, initializers)
      # are excluded; the rule is in ai-docs/coverage-exclusions.md. The lists are posted on the PR in
      # one comment, and only the last step fails the job when either is not empty. The whole-library
      # row is gated on both halves: the job fails while any line anywhere in the library is never run,
      # or any hand-written decision outcome anywhere in the library is untested (members excluded by
      # ai-docs/coverage-exclusions.md are absent from the reports and are not counted).
      - name: Merge Coverage Across Test Processes
        id: uncovered
        shell: pwsh
        env:
          PR: ${{ inputs.pull-request }}
          DIFF_BASE: ${{ inputs.diff-base }}
          QUEUE_GROUP: ${{ inputs.queue-group }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $gate = @()
          if ($env:PR) {
            # A PR run measures against its base branch; a merge-queue leg against the queue base, a commit
            # the full-history checkout already holds.
            $base = $env:DIFF_BASE
            if ($base -notmatch '^[0-9a-f]{40}$') {
              git fetch --no-tags origin "$base"
              $base = "origin/$base"
            }
            $gate = @('-BaseRef', $base, '-OutFile', 'coverage/uncovered-new-lines.txt', '-BranchOutFile', 'coverage/uncovered-new-branches.txt')
          }
          & pwsh scripts/Find-UncoveredNewLines.ps1 -CoverageRoot coverage -MergedOutFile coverage-merged/merged.cobertura.xml -SummaryOutFile coverage-merged/whole-library.json -LibraryGapOutFile coverage-merged/library-gap.txt @gate | Write-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:QUEUE_GROUP -eq 'true') {
            # The group's new code is every pull request's; this one is reported only the findings in the
            # files it changed (a file two of them changed reports to both).
            gh api --paginate "repos/$env:REPO/pulls/$env:PR/files" --jq '.[].filename' > coverage/pr-files.txt
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::Could not list the files pull request #$env:PR changed."; exit 1 }
            & pwsh .github/scripts/Select-PullRequestFinding.ps1 -FileList coverage/pr-files.txt -Path coverage/uncovered-new-lines.txt, coverage/uncovered-new-branches.txt | Write-Host
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $whole = Get-Content coverage-merged/whole-library.json -Raw | ConvertFrom-Json
          "whole=$($whole.Text)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "wholeUntested=$($whole.Untested)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "wholeUncoveredLines=$($whole.UncoveredLines)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($env:PR) {
            $count = @(Get-Content coverage/uncovered-new-lines.txt -ErrorAction SilentlyContinue | Where-Object { $_ }).Count
            $branches = @(Get-Content coverage/uncovered-new-branches.txt -ErrorAction SilentlyContinue | Where-Object { $_ }).Count
            "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "branches=$branches" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Merge Coverage Reports
        run: |
          # The single report the step above merged across test processes (every per-process report
          # is in it); the per-process files remain the Codecov upload and the empty-coverage check.
          COVERAGE_FILES="coverage-merged/merged.cobertura.xml"
          echo "Coverage files to merge: $COVERAGE_FILES"

          # File filters to exclude from coverage reports
          # Exclude source-generated files (*.g.cs, .whizbang/cache) plus
          # test and tool code so the gate measures library (src/) coverage only,
          # matching the codecov.yml ignore list
          FILE_FILTERS="-*.g.cs;-**/.whizbang/cache/*;-*/tests/*;-*/tools/*"

          # Generate merged report in SonarQube format
          reportgenerator \
            "-reports:${COVERAGE_FILES}" \
            "-targetdir:coverage/sonarqube" \
            "-reporttypes:SonarQube" \
            "-filefilters:${FILE_FILTERS}"

          # Convert absolute paths to relative paths for SonarCloud
          # Remove CI runner path AND deterministic build prefix (/_/)
          sed -i 's|/home/runner/work/whizbang/whizbang/||g' coverage/sonarqube/SonarQube.xml
          sed -i 's|/_/||g' coverage/sonarqube/SonarQube.xml

          # Debug: show first few lines to verify paths
          echo "=== Merged coverage report (first 30 lines) ==="
          head -30 coverage/sonarqube/SonarQube.xml

          # Also generate text summary for coverage check (same filters)
          reportgenerator \
            "-reports:${COVERAGE_FILES}" \
            "-targetdir:coverage/summary" \
            "-reporttypes:TextSummary" \
            "-filefilters:${FILE_FILTERS}"

      - name: Check Coverage Threshold
        run: |
          # Parse coverage from TextSummary report
          COVERAGE=$(grep "Line coverage:" coverage/summary/Summary.txt | grep -oP '\d+(\.\d+)?(?=%)' | head -1)
          echo "Line coverage: ${COVERAGE}%"
          # Reported, not gated: the threshold below is on lines only.
          grep -E "Branch coverage:|Covered branches:|Total branches:" coverage/summary/Summary.txt || true

          # Fail if coverage could not be parsed
          if [ -z "$COVERAGE" ]; then
            echo "::error::Failed to parse coverage percentage from Summary.txt"
            echo "Summary.txt contents:"
            cat coverage/summary/Summary.txt
            exit 1
          fi

          # Check against threshold
          THRESHOLD=80
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
          fi

      - name: SonarScanner End
        # ONLY a pull request, or a run on main (a release landing, or a manual re-analysis).
        # Every other context — develop pushes, the merge queue, a dispatch on any other branch —
        # skips the scanner entirely. Analyzing anything else is actively harmful: see the branch
        # note below.
        if: inputs.sonar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      # ---- PR quality gate: 100% of new lines and hand-written branches covered, zero Sonar findings --
      # The uncovered new lines and branches were listed by "Merge Coverage Across Test Processes".
      - name: Sonar Findings on New Code
        if: inputs.pull-request != ''
        id: sonar-findings
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR: ${{ inputs.pull-request }}
          QUEUE_GROUP: ${{ inputs.queue-group }}
        run: |
          & pwsh scripts/Get-SonarPrFindings.ps1 -PullRequest $env:PR -WaitForAnalysis .sonarqube/out/.sonar/report-task.txt -OutFile coverage/sonar-findings.txt | Write-Host
          if ($env:QUEUE_GROUP -eq 'true') {
            & pwsh .github/scripts/Select-PullRequestFinding.ps1 -FileList coverage/pr-files.txt -Path coverage/sonar-findings.txt | Write-Host
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $count = @(Get-Content coverage/sonar-findings.txt -ErrorAction SilentlyContinue | Where-Object { $_ }).Count
          "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload PR Gate Reports
        if: inputs.pull-request != '' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One per pull request in a merge-queue group.
          name: pr-quality-gate${{ inputs.queue-group && format('-{0}', inputs.pull-request) || '' }}
          path: |
            coverage/uncovered-new-lines.txt
            coverage/uncovered-new-branches.txt
            coverage/sonar-findings.txt
            coverage-merged/whole-library.json
            coverage-merged/library-gap.txt
          if-no-files-found: ignore

      - name: Comment PR Gate Results
        if: inputs.pull-request != '' && always() && steps.uncovered.outputs.count != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          UNCOVERED: ${{ steps.uncovered.outputs.count }}
          UNCOVERED_BRANCHES: ${{ steps.uncovered.outputs.branches }}
          FINDINGS: ${{ steps.sonar-findings.outputs.count }}
          WHOLE_LIBRARY: ${{ steps.uncovered.outputs.whole }}
          WHOLE_UNTESTED: ${{ steps.uncovered.outputs.wholeUntested }}
          WHOLE_UNCOVERED_LINES: ${{ steps.uncovered.outputs.wholeUncoveredLines }}
          HEAD_SHA: ${{ inputs.checked-sha }}
          PR_HEAD_SHA: ${{ inputs.pull-request-sha || inputs.checked-sha }}
          PR: ${{ inputs.pull-request }}
          QUEUE_GROUP: ${{ inputs.queue-group }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER="<!-- pr-quality-gate -->"
          CHECKED_AT=$(date -u '+%Y-%m-%d %H:%M UTC')
          BODY="${MARKER}
          ## PR quality gate

          Checked commit \`${HEAD_SHA:0:9}\` at ${CHECKED_AT} ([run](${RUN_URL}))$([ "$QUEUE_GROUP" = true ] && echo ", in the merge queue: the integration suites and this gate run there, once, for every pull request in the group, and each pull request is reported the findings in the files it changed")

          | Check | Result |
          |---|---|
          | Coverage of new lines | $([ "${UNCOVERED}" = "0" ] && echo "100%, every added library line is executed by a test" || echo "**${UNCOVERED} line(s) not executed by any test**") |
          | Coverage of new branches | $([ "${UNCOVERED_BRANCHES}" = "0" ] && echo "100%, every outcome of every added hand-written decision is taken by a test" || echo "**${UNCOVERED_BRANCHES} line(s) with a decision outcome no test takes**") |
          | Sonar findings on new code | $([ "${FINDINGS:-?}" = "0" ] && echo "none" || echo "**${FINDINGS:-?} open finding(s)**") |
          | Whole library (gated) | $([ "${WHOLE_UNTESTED}" = "0" ] && [ "${WHOLE_UNCOVERED_LINES}" = "0" ] && echo "${WHOLE_LIBRARY:-unknown}" || echo "**${WHOLE_LIBRARY:-unknown}**") |
          "
          if [ "${UNCOVERED}" != "0" ]; then
            BODY="${BODY}
          <details><summary>Uncovered new lines</summary>

          \`\`\`
          $(cat coverage/uncovered-new-lines.txt)
          \`\`\`
          </details>
          "
          fi
          if [ "${UNCOVERED_BRANCHES}" != "0" ]; then
            BODY="${BODY}
          <details><summary>Uncovered new branches</summary>

          \`\`\`
          $(cat coverage/uncovered-new-branches.txt)
          \`\`\`
          </details>
          "
          fi
          if [ -s coverage/sonar-findings.txt ]; then
            BODY="${BODY}
          <details><summary>Sonar findings</summary>

          \`\`\`
          $(cat coverage/sonar-findings.txt)
          \`\`\`
          </details>
          "
          fi
          BODY="${BODY}
          Reproduce locally: \`pwsh scripts/Invoke-PrHealth.ps1 -PullRequest ${PR}\`
          A maintainer can draft these as a review: \`pwsh scripts/Invoke-PrReviewDraft.ps1 -PullRequest ${PR}\`"
          # The same findings as a hidden block scripts/Invoke-PrReviewDraft.ps1 reads (scripts/lib/ReviewFindings.psm1).
          BLOCK=$(pwsh -NoProfile -Command "Import-Module ./scripts/lib/ReviewFindings.psm1; ConvertTo-ReviewBlock -Source pr-quality-gate -Sha '${PR_HEAD_SHA}' -Findings @(Get-GateFindings -UncoveredLinesFile coverage/uncovered-new-lines.txt -UncoveredBranchesFile coverage/uncovered-new-branches.txt -SonarFile coverage/sonar-findings.txt)") \
            || BLOCK="<!-- whizbang-review findings block could not be written -->"
          BODY="${BODY}

          ${BLOCK}"
          # Re-post rather than edit, so the latest result is always the newest comment in the thread (an
          # edited comment keeps its original position and creation time, which reads as stale).
          gh api --method POST "repos/${{ github.repository }}/issues/${PR}/comments" -f body="${BODY}" >/dev/null
          # Every run keeps its comment; earlier ones are minimized as outdated, never deleted.
          pwsh -NoProfile -File .github/scripts/Hide-OutdatedComments.ps1 -Repository "${{ github.repository }}" -PullRequest "${PR}" -Marker "$MARKER"

      - name: Fail on PR Gate Violations
        if: inputs.pull-request != '' && (steps.uncovered.outputs.count != '0' || steps.uncovered.outputs.branches != '0' || steps.sonar-findings.outputs.count != '0' || steps.uncovered.outputs.wholeUntested != '0' || steps.uncovered.outputs.wholeUncoveredLines != '0')
        run: |
          echo "::error::PR quality gate: ${{ steps.uncovered.outputs.count }} uncovered new line(s), ${{ steps.uncovered.outputs.branches }} uncovered new branch(es), ${{ steps.sonar-findings.outputs.count }} open Sonar finding(s), ${{ steps.uncovered.outputs.wholeUncoveredLines }} never-run line(s) and ${{ steps.uncovered.outputs.wholeUntested }} untested hand-written outcome(s) in the whole library. All must be zero (see the pr-quality-gate artifact, its library-gap.txt, and the PR comment)."
          exit 1
