name: Quality (Reusable)

# Runs coverage merge + threshold + SonarCloud analysis. To keep the expensive
# Sonar-wrapped build OFF the test-suite critical path, this job starts alongside the
# suites: SonarScanner begins and the solution builds while tests run elsewhere, then a
# wait step polls for the suites' coverage artifacts (failing fast if any test job
# fails), and only the cheap merge/threshold/scanner-end steps happen after that.
# The caller must grant `actions: read` (artifact/job polling) in addition to
# `contents: read`.

on:
  workflow_call:
    inputs:
      coverage-run-id:
        description: >-
          Run whose suites produced the coverage to analyze, when this run's suites yielded to it
          (a release PR's push run, or the release-branch run behind a main push). Empty: this run.
        type: string
        required: false
        default: ''
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud token"
        required: true
      CODECOV_TOKEN:
        description: "Codecov token"
        required: true

jobs:
  quality:
    name: Sonar and coverage
    runs-on: ubuntu-latest
    # pull-requests: write lets the uncovered-new-lines gate comment on the PR; the caller must grant it too.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    # Sized for runner queueing, not work: this job starts with the run and waits for suites that
    # may sit queued for most of an hour before they start (a 60-minute budget once canceled a
    # required check while every suite was still green).
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for SonarCloud

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-retry
        with:
          dotnet-version: '10.0.x'

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-reportgenerator-globaltool

      # SonarCloud free plan only supports main branch + PR analysis, so the scanner is
      # skipped for push events to non-main branches (e.g. develop).
      #
      # merge_group is skipped too, and NOT because it is cheap to drop: the queue ref is a
      # throwaway (gh-readonly-queue/develop/pr-N-<sha>) and carries no pull_request context,
      # so the scanner would submit a BRANCH analysis of a branch that ceases to exist minutes
      # later — rejected outright on the main-plus-PRs free plan. The PR analysis already
      # gated this exact change, and keeping the queue run lean is the point of the queue.
      - name: SonarScanner Begin
        # ONLY a pull request, or a run on main (a release landing, or a manual re-analysis).
        # Every other context — develop pushes, the merge queue, a dispatch on any other branch —
        # skips the scanner entirely. Analyzing anything else is actively harmful: see the branch
        # note below.
        if: github.event_name == 'pull_request' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # coverageReportPaths is a path only — the file is produced later, after the
          # suites' coverage artifacts arrive; the scanner reads it at the End step.
          SONAR_ARGS=(
            /k:"whizbang-lib_whizbang" /o:"whizbang-lib"
            /d:sonar.token="${SONAR_TOKEN}"
            /d:sonar.host.url="https://sonarcloud.io"
            /d:sonar.coverageReportPaths="coverage/sonarqube/SonarQube.xml"
          )

          # A PR is a pull-request analysis against its base; a main push is the main-branch
          # analysis (no sonar.branch.name — SonarCloud's default). There is deliberately no third
          # shape. A manual run on main takes the same path, so the main line can be re-analyzed
          # without waiting for the next release.
          #
          # This organization's SonarCloud plan does not serve non-main branch data: reads return
          # "Organization is not allowed to access data from non main branches." Submitting a
          # long-lived branch analysis still half-creates the branch — it appears in
          # project_branches/list with no analysis date — and a PR's quality gate is resolved
          # against its BASE branch, so once `develop` existed in that unreadable state every
          # PR into develop failed post-processing with "Not authorized or project not found"
          # AFTER uploading its report successfully. The analysis is fine; the gate lookup is what
          # cannot resolve the base. Do not submit a branch analysis here until the plan supports
          # it, and delete any branch that was created (Administration -> Branches & Pull Requests).
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SONAR_ARGS+=(
              /d:sonar.pullrequest.key="$PR_NUMBER"
              /d:sonar.pullrequest.branch="$HEAD_REF"
              /d:sonar.pullrequest.base="$BASE_REF"
            )
          fi
          SONAR_ARGS+=(/d:sonar.qualitygate.wait=true)

          # Load ALL sonar.* properties from shared config (single source of truth with local scripts)
          while IFS='=' read -r key value; do
            # Skip comments and empty lines
            [[ "$key" =~ ^#.*$ || -z "$key" ]] && continue
            key=$(echo "$key" | xargs)  # trim
            value=$(echo "$value" | xargs)  # trim
            SONAR_ARGS+=(/d:"$key=$value")
          done < sonar.config

          dotnet-sonarscanner begin "${SONAR_ARGS[@]}"

      # Single build serves both the scanner (analysis hooks) and ReportGenerator
      # (source-generated files must exist before the coverage merge). Runs while the
      # test suites are still executing in their own jobs.
      # Build ONLY what Sonar analyzes. sonar.config excludes samples, benchmarks, tools and
      # scripts from analysis, yet the full-solution build compiled them anyway — 28 of the 93
      # projects, built purely to be thrown away. Tests are NOT excluded (sonar.config carries
      # per-rule ignores for **/tests/**, which only makes sense if they are analyzed).
      #
      # The exclusion list is READ FROM sonar.config rather than hardcoded here, so the build
      # scope and the analysis scope cannot drift apart — one source of truth, and adding an
      # exclusion there automatically stops building it.
      #
      # The solution is produced by FILTERING the real Whizbang.slnx, not by synthesising a bare
      # one. A synthesised solution omits the <Configurations> block, and without it MSBuild can
      # resolve a project under more than one platform concurrently — two writers on the same
      # deps.json, which fails as "the process cannot access the file".
      - name: Generate analysis solution
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $cfg = Get-Content sonar.config -Raw
          $m = [regex]::Match($cfg, '(?m)^sonar\.exclusions=(.+)$')
          if (-not $m.Success) { throw 'sonar.exclusions not found in sonar.config' }
          $pats = @($m.Groups[1].Value -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $dirs = @($pats | ForEach-Object { $mm = [regex]::Match($_, '^\*\*/([^/*]+)/\*\*'); if ($mm.Success) { $mm.Groups[1].Value } })
          $kept = [System.Text.StringBuilder]::new(); $dropped = 0
          # Split keeping line endings, so the kept file is byte-for-byte the solution minus dropped lines.
          foreach ($line in [regex]::Split((Get-Content Whizbang.slnx -Raw), '(?<=\n)')) {
            $pm = [regex]::Match($line, '<Project Path="([^"]+)"')
            if ($pm.Success -and ($dirs | Where-Object { $pm.Groups[1].Value -match "(^|/)$([regex]::Escape($_))/" })) { $dropped++; continue }
            [void]$kept.Append($line)
          }
          $out = $kept.ToString()
          [System.IO.File]::WriteAllText((Join-Path -Path $PWD -ChildPath 'Whizbang.Analysis.slnx'), $out)
          $analysed = ([regex]::Matches($out, '<Project Path=')).Count
          Write-Output "excluded dirs from sonar.config: $($dirs -join ', ')"
          Write-Output "dropped $dropped projects; analysing $analysed"
          if (-not $out.Contains('<Configurations>')) { throw 'Configurations block must survive (see comment above)' }
          if ($analysed -eq 0) { throw 'refusing to analyse an empty solution' }

      - name: Build (analyzed)
        run: dotnet build Whizbang.Analysis.slnx --configuration Release

      - name: Wait for test suites to publish coverage
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.coverage-run-id || github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          # The expected coverage count is DERIVED, never configured: every suite leg is a job named
          # "Test · <suite> / Run suite" and uploads exactly one coverage-* artifact. All suites need only
          # Build, so once Build succeeds every leg exists in the jobs list (queued or not), and the
          # leg count is final. A hardcoded count hung this step forever after a reshard.
          # Ends on job STATE, not a poll budget: runner queueing can delay suites for most of an
          # hour, and the job-level timeout is the only backstop.
          SUITE='(.name | test("^Test · .* / Run suite$"))'
          # A SKIPPED reusable-workflow job reports under its PARENT name only ("Test · RabbitMQ"),
          # with no " / child" part, so SUITE cannot see it: match the bare parent too.
          SKIPPED_SUITE='(.conclusion == "skipped" and (.name | test("^Test · [^/]*$")))'
          GRACE=0
          while :; do
            if ! JOBS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100"); then
              echo "::warning::Could not list jobs for run $RUN_ID; retrying"
              sleep 30; continue
            fi
            BUILD=$(jq -r '[.jobs[] | select(.name | startswith("Build · Compile")) | .conclusion // "pending"] | first // "pending"' <<< "$JOBS")
            # A run that REUSED already-tested results (queue-validated: a develop push, or a release
            # cut from a tested develop commit) skips its suites on purpose and republishes the
            # tested run's coverage as coverage-republished. Absent or skipped = a normal run.
            REPUB=$(jq -r '[.jobs[] | select(.name == "Report · Republish the tested run'"'"'s coverage") | .conclusion // "pending"] | first // "absent"' <<< "$JOBS")
            if [ "$REPUB" != absent ] && [ "$REPUB" != skipped ]; then
              case "$REPUB" in
                success)
                  COUNT=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
                    --jq '[.artifacts[].name | select(startswith("coverage-"))] | length' || echo 0)
                  if [ "$COUNT" -ge 1 ]; then
                    echo "Run $RUN_ID reused already-tested results; its republished coverage is present."
                    exit 0
                  fi
                  GRACE=$((GRACE + 1))
                  if [ "$GRACE" -gt 4 ]; then
                    echo "::error::Run $RUN_ID republished its tested run's reports but holds no coverage-* artifact."
                    exit 1
                  fi ;;
                failure|cancelled)
                  echo "::error::Run $RUN_ID reused already-tested results but failed to republish their coverage."
                  exit 1 ;;
              esac
              echo "Run $RUN_ID reuses already-tested results; waiting for its republished coverage — sleeping 30s"
              sleep 30; continue
            fi
            # Fail fast when coverage will never arrive: a suite that failed, was canceled, or was
            # SKIPPED (e.g. its build dependency failed), or a failed build job itself.
            DEAD=$(jq "[.jobs[] | select(($SUITE and (.conclusion == \"failure\" or .conclusion == \"cancelled\" or .conclusion == \"skipped\")) or $SKIPPED_SUITE)] | length" <<< "$JOBS")
            if [ "$BUILD" = failure ] || [ "$BUILD" = cancelled ] || [ "$DEAD" -gt 0 ]; then
              echo "::error::Build is '$BUILD' and $DEAD suite job(s) failed, were canceled, or were skipped — coverage will never arrive; aborting quality analysis."
              exit 1
            fi
            if [ "$BUILD" != success ]; then
              echo "Build is '$BUILD'; suites not started yet — sleeping 30s"
              sleep 30; continue
            fi

            EXPECTED=$(jq "[.jobs[] | select($SUITE)] | length" <<< "$JOBS")
            DONE=$(jq "[.jobs[] | select($SUITE and .conclusion == \"success\")] | length" <<< "$JOBS")
            COUNT=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[].name | select(startswith("coverage-"))] | length' || echo 0)
            if [ "$DONE" -eq "$EXPECTED" ]; then
              if [ "$EXPECTED" -gt 0 ] && [ "$COUNT" -ge "$EXPECTED" ]; then
                echo "All $EXPECTED suites green; $COUNT coverage artifacts present."
                exit 0
              fi
              # Every suite finished green but an artifact is missing: allow a short grace for
              # listing lag, then fail loudly instead of hanging.
              GRACE=$((GRACE + 1))
              if [ "$GRACE" -gt 4 ]; then
                echo "::error::$EXPECTED suite legs finished green but only $COUNT coverage-* artifacts exist. A suite leg stopped uploading coverage, or the suite job naming changed (legs must be named 'Test · <suite> / Run suite')."
                exit 1
              fi
            fi
            echo "$DONE/$EXPECTED suites green, $COUNT coverage artifacts present — sleeping 30s"
            sleep 30
          done

      - name: Download All Coverage Artifacts
        if: inputs.coverage-run-id == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Download Coverage from the Covering Run
        if: inputs.coverage-run-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
          run-id: ${{ inputs.coverage-run-id }}
          github-token: ${{ github.token }}

      - name: List Downloaded Coverage Files
        run: |
          echo "=== Downloaded coverage files ==="
          find coverage -name "*.cobertura.xml" -o -name "*.xml" 2>/dev/null || echo "No coverage files found"
          ls -laR coverage/ || echo "Coverage directory empty or missing"

      - name: Upload Merged Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          files: '**/*.cobertura.xml'
          fail_ci_if_error: false
          flags: alltests
          name: codecov-merged

      - name: Check Coverage Files
        id: check-coverage
        run: |
          # Find all cobertura XML files
          COVERAGE_FILES=$(find coverage -name "*.cobertura.xml" 2>/dev/null | tr '\n' ';')

          if [ -z "$COVERAGE_FILES" ]; then
            echo "::error::No coverage files found - this should not happen"
            echo "Coverage files are required for quality analysis"
            exit 1
          fi

          echo "Found coverage files: $COVERAGE_FILES"
          echo "files=$COVERAGE_FILES" >> "$GITHUB_OUTPUT"

      - name: Merge Coverage Reports
        run: |
          COVERAGE_FILES="${{ steps.check-coverage.outputs.files }}"
          echo "Coverage files to merge: $COVERAGE_FILES"

          # File filters to exclude from coverage reports
          # Exclude source-generated files (*.g.cs, .whizbang/cache) plus
          # test and tool code so the gate measures library (src/) coverage only,
          # matching the codecov.yml ignore list
          FILE_FILTERS="-*.g.cs;-**/.whizbang/cache/*;-*/tests/*;-*/tools/*"

          # Generate merged report in SonarQube format
          reportgenerator \
            "-reports:${COVERAGE_FILES}" \
            "-targetdir:coverage/sonarqube" \
            "-reporttypes:SonarQube" \
            "-filefilters:${FILE_FILTERS}"

          # Convert absolute paths to relative paths for SonarCloud
          # Remove CI runner path AND deterministic build prefix (/_/)
          sed -i 's|/home/runner/work/whizbang/whizbang/||g' coverage/sonarqube/SonarQube.xml
          sed -i 's|/_/||g' coverage/sonarqube/SonarQube.xml

          # Debug: show first few lines to verify paths
          echo "=== Merged coverage report (first 30 lines) ==="
          head -30 coverage/sonarqube/SonarQube.xml

          # Also generate text summary for coverage check (same filters)
          reportgenerator \
            "-reports:${COVERAGE_FILES}" \
            "-targetdir:coverage/summary" \
            "-reporttypes:TextSummary" \
            "-filefilters:${FILE_FILTERS}"

      - name: Check Coverage Threshold
        run: |
          # Parse coverage from TextSummary report
          COVERAGE=$(grep "Line coverage:" coverage/summary/Summary.txt | grep -oP '\d+(\.\d+)?(?=%)' | head -1)
          echo "Line coverage: ${COVERAGE}%"

          # Fail if coverage could not be parsed
          if [ -z "$COVERAGE" ]; then
            echo "::error::Failed to parse coverage percentage from Summary.txt"
            echo "Summary.txt contents:"
            cat coverage/summary/Summary.txt
            exit 1
          fi

          # Check against threshold
          THRESHOLD=80
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
          fi

      - name: SonarScanner End
        # ONLY a pull request, or a run on main (a release landing, or a manual re-analysis).
        # Every other context — develop pushes, the merge queue, a dispatch on any other branch —
        # skips the scanner entirely. Analyzing anything else is actively harmful: see the branch
        # note below.
        if: github.event_name == 'pull_request' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      # ---- PR quality gate: 100% coverage of new lines, zero open Sonar findings ----------------------
      # Both lists are computed after the scanner has submitted the analysis, uploaded, posted on the
      # PR in one comment, and only then does one step fail the job when either list is not empty.
      - name: Uncovered New Lines
        if: github.event_name == 'pull_request'
        id: uncovered
        shell: pwsh
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          & pwsh scripts/Find-UncoveredNewLines.ps1 -CoverageRoot coverage -BaseRef "origin/${{ github.base_ref }}" -OutFile coverage/uncovered-new-lines.txt | Write-Host
          $count = @(Get-Content coverage/uncovered-new-lines.txt -ErrorAction SilentlyContinue | Where-Object { $_ }).Count
          "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sonar Findings on New Code
        if: github.event_name == 'pull_request'
        id: sonar-findings
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          & pwsh scripts/Get-SonarPrFindings.ps1 -PullRequest ${{ github.event.pull_request.number }} -WaitForAnalysis .sonarqube/out/.sonar/report-task.txt -OutFile coverage/sonar-findings.txt | Write-Host
          $count = @(Get-Content coverage/sonar-findings.txt -ErrorAction SilentlyContinue | Where-Object { $_ }).Count
          "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload PR Gate Reports
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-quality-gate
          path: |
            coverage/uncovered-new-lines.txt
            coverage/sonar-findings.txt
          if-no-files-found: ignore

      - name: Comment PR Gate Results
        if: github.event_name == 'pull_request' && always() && steps.uncovered.outputs.count != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          UNCOVERED: ${{ steps.uncovered.outputs.count }}
          FINDINGS: ${{ steps.sonar-findings.outputs.count }}
        run: |
          MARKER="<!-- pr-quality-gate -->"
          BODY="${MARKER}
          ## PR quality gate

          | Check | Result |
          |---|---|
          | Coverage of new lines | $([ "${UNCOVERED}" = "0" ] && echo "100%, every added library line is executed by a test" || echo "**${UNCOVERED} line(s) not executed by any test**") |
          | Sonar findings on new code | $([ "${FINDINGS:-?}" = "0" ] && echo "none" || echo "**${FINDINGS:-?} open finding(s)**") |
          "
          if [ "${UNCOVERED}" != "0" ]; then
            BODY="${BODY}
          <details><summary>Uncovered new lines</summary>

          \`\`\`
          $(cat coverage/uncovered-new-lines.txt)
          \`\`\`
          </details>
          "
          fi
          if [ -s coverage/sonar-findings.txt ]; then
            BODY="${BODY}
          <details><summary>Sonar findings</summary>

          \`\`\`
          $(cat coverage/sonar-findings.txt)
          \`\`\`
          </details>
          "
          fi
          BODY="${BODY}
          Reproduce locally: \`pwsh scripts/Invoke-PrHealth.ps1 -PullRequest ${{ github.event.pull_request.number }}\`"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)
          if [ -n "${EXISTING}" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING}" -f body="${BODY}" >/dev/null
          else
            gh api --method POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -f body="${BODY}" >/dev/null
          fi

      - name: Fail on PR Gate Violations
        if: github.event_name == 'pull_request' && (steps.uncovered.outputs.count != '0' || steps.sonar-findings.outputs.count != '0')
        run: |
          echo "::error::PR quality gate: ${{ steps.uncovered.outputs.count }} uncovered new line(s), ${{ steps.sonar-findings.outputs.count }} open Sonar finding(s). Both must be zero (see the pr-quality-gate artifact and the PR comment)."
          exit 1
