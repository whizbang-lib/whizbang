name: Build Cost Timing

# How long each generator and analyzer takes over a large generated consumer (1,000 features and 3,000
# files of ordinary code), median of 5 runs, against
# benchmarks/Whizbang.BuildCost.Benchmarks/build-cost-thresholds.json (#1651). Timing is not a test, so
# this is a tool and an advisory check: no ruleset requires it and Gate · CI result does not read it. The
# table is the job summary and an artifact.
#
# It used to run inside ci.yml on every event, about 16 minutes of a GitHub-hosted runner each time
# (148 runner-hours over two weeks) for a number that only moves when the code it times moves (#2068).
# It now runs when that code changes (the generator projects and their shared code, the repository's own
# analyzers, the benchmark and this file), on a weekly schedule that catches drift from everything else
# (an SDK or Roslyn update), and on demand.

on:
  pull_request:
    branches: [main, develop, 'release/v**']
    paths:
      - 'src/*Generators*/**'
      - 'src/Whizbang.TestAnalyzers/**'
      - 'tools/Whizbang.RepoAnalyzers/**'
      - 'benchmarks/Whizbang.BuildCost.Benchmarks/**'
      - '.github/workflows/build-cost-timing.yml'
  push:
    branches: [develop]
    # The same list as pull_request above: keep the two identical.
    paths:
      - 'src/*Generators*/**'
      - 'src/Whizbang.TestAnalyzers/**'
      - 'tools/Whizbang.RepoAnalyzers/**'
      - 'benchmarks/Whizbang.BuildCost.Benchmarks/**'
      - '.github/workflows/build-cost-timing.yml'
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new commit on a pull request supersedes the older timing; pushes and the schedule each keep their run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  timing:
    name: Build · Generator and analyzer timing
    # Always GitHub-hosted: its thresholds were measured on GitHub-hosted runners, and a timing taken on
    # other hardware would compare against the wrong numbers.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-retry
        with:
          dotnet-version: '10.0.x'

      - name: Build the benchmark and the generator packages
        run: dotnet build benchmarks/Whizbang.BuildCost.Benchmarks -c Release -nologo -v:q

      - name: Time every generator and analyzer against its threshold
        run: |
          mkdir -p build-cost
          dotnet run -c Release --no-build --project benchmarks/Whizbang.BuildCost.Benchmarks -- --output build-cost/timing.md

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-cost-timing-${{ github.run_id }}
          path: build-cost/
          retention-days: 14
