name: Build (Reusable)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to stamp into assemblies (from GitVersion). If empty, uses Directory.Build.props default.'
        required: false
        type: string
        default: ''

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NOLOGO: '1'

# The repository default is read-only; stated here so no job can silently gain more.
permissions:
  contents: read

jobs:
  build:
    name: Compile and hash
    runs-on: ubuntu-latest
    # The analyzers run in every project now, which roughly doubles the solution build on a
    # hosted runner (16 minutes observed); the artifact upload and instrumentation follow it.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-retry
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Display .NET Info
        run: dotnet --info

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore --locked-mode

      - name: Build Solution
        env:
          # Env-var indirection (githubactions:S7630): never interpolate workflow inputs
          # directly into a run block — the shell sees only the variable, not the value.
          VERSION: ${{ inputs.version }}
        run: |
          BUILD_ARGS=(--no-restore --configuration Release)
          if [ -n "$VERSION" ]; then BUILD_ARGS+=("-p:Version=$VERSION"); fi
          dotnet build "${BUILD_ARGS[@]}"

      # Formatting verification runs as a separate parallel job (ci.yml `format`) so it
      # stays off the build -> test-suites critical path.

      # Determinism manifest: sha256 of every packable output (src/ + tools/), hashed
      # BEFORE coverage instrumentation rewrites anything, plus the exact version and SDK
      # that produced them. A later develop-push run that skips its test matrix because
      # the merge queue already validated this exact SHA proves "same toolchain, same
      # bits" by rebuilding with this manifest's version and diffing hashes — see
      # ci.yml's verify-rebuild job. Cheap enough to run unconditionally.
      # NOTE: the output directory must NOT be dot-prefixed. actions/upload-artifact v4+
      # defaults include-hidden-files: false and silently excludes a hidden directory's
      # entire contents ("No files were found with the provided path"), so a `.determinism/`
      # dir uploaded NOTHING while the step still reported success — leaving verify-rebuild
      # with no manifest and blocking every develop alpha. Keep this name non-hidden.
      - name: Generate determinism manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build-determinism
          printf '%s' "${VERSION:-}" > build-determinism/version.txt
          dotnet --version > build-determinism/sdk.txt
          find src tools -path "*/bin/Release/*" \( -name "*.dll" -o -name "*.exe" \) -type f \
            ! -path "*/ref/*" | sort | xargs sha256sum > build-determinism/assemblies.sha256
          echo "hashed $(wc -l < build-determinism/assemblies.sha256) assemblies at version '${VERSION:-<props default>}'"

      - name: Upload determinism manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: determinism-manifest-${{ github.run_id }}
          path: build-determinism/
          # Fail loudly instead of warning: a missing manifest here silently blocks every
          # queue-validated develop publish downstream (verify-rebuild has nothing to check).
          if-no-files-found: error
          retention-days: 3

      # ----------------------------------------------------------------------------
      # Coverage instrumentation: ONCE per run, here, instead of once per test job.
      #
      # dotnet-coverage instrument is a static rewrite: it bakes the session id into the
      # binary, which then reports to a collector of that name on whatever machine runs it.
      # Sessions are machine-local IPC, so every test job can start its own collector under
      # the SAME id without colliding. That is what lets this move out of the test jobs,
      # where it was ~11 minutes of every single one (70-75% of the job, against 5-23% for
      # the tests themselves).
      #
      # It runs in the BACKGROUND while the clean build uploads, on copies in work folders
      # outside the workspace, never on the files being uploaded; the results are collected
      # in a staging folder that becomes the overlay.
      # Three things that must not break:
      #
      #   1. NuGet. The pack job consumes build-<run> and runs `dotnet pack --no-build`, so
      #      an instrumented src/ or tools/ output would SHIP instrumented assemblies. Only
      #      tests/ + samples/ copies are instrumented, and only in the staging folder; the
      #      guard below re-checks every packable hash after instrumentation finishes.
      #   2. The overlay's layout. Test jobs download build-<run>, then build-instrumented-<run>
      #      on top. The staging folder mirrors the workspace (tests/..., samples/...) and is
      #      uploaded as its own root, so the paths line up and the instrumented copies
      #      replace the clean ones.
      #   3. Duplicate work. The same assembly is copied into every test project's output:
      #      386 paths for 123 distinct blobs. Instrument each blob once, in parallel, and
      #      copy the result to its twins' staged paths. Dedupe is by CONTENT hash, not file
      #      name: 18 names have copies that genuinely differ across projects, so name-keying
      #      would ship the wrong bits.
      # ----------------------------------------------------------------------------
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Start coverage instrumentation in the background
        env:
          SESSION_ID: coverage-${{ github.run_id }}
          STAGE: ${{ runner.temp }}/coverage-overlay
        run: |
          set -euo pipefail
          mapfile -t DLLS < <(find tests samples -path "*/bin/Release/*" -name "Whizbang.*.dll" -type f \
            ! -name "*.resources.dll" ! -path "*/ref/*" ! -name "*.g.dll" | sort)
          echo "found ${#DLLS[@]} paths"

          # One representative per content hash, prepared here, before the upload starts,
          # in a private work folder of its own: a copy of the .dll and .pdb (both are
          # rewritten; instrument refuses with "no_symbols" when the pdb is absent) plus
          # symlinks to every other assembly beside the original, which instrument needs to
          # resolve references. Two things this layout rules out, both seen on a real run:
          #   - instrument -o cannot resolve references at all (it fails on every assembly
          #     that references another Whizbang assembly), so it must rewrite in place;
          #   - instrument removes its input's pdb while it works, so the input must never be
          #     a file the upload is reading.
          # A folder per blob means parallel runs never read a neighbor that another run is
          # rewriting; the symlinks point at workspace files nothing rewrites.
          declare -A REP
          WORK="$RUNNER_TEMP/coverage-work"
          : > "$RUNNER_TEMP/instrument-reps.txt"
          : > "$RUNNER_TEMP/instrument-twins.txt"
          SKIPPED=0; N=0
          for dll in "${DLLS[@]}"; do
            [ -f "${dll%.dll}.pdb" ] || { SKIPPED=$((SKIPPED+1)); continue; }   # no symbols => cannot instrument
            HASH=$(sha256sum "$dll" | cut -d' ' -f1)
            if [ -n "${REP[$HASH]:-}" ]; then
              printf '%s\t%s\n' "${REP[$HASH]}" "$dll" >> "$RUNNER_TEMP/instrument-twins.txt"
              continue
            fi
            REP[$HASH]="$dll"
            N=$((N+1))
            mkdir -p "$WORK/$N"
            cp "$dll" "${dll%.dll}.pdb" "$WORK/$N/"
            for dep in "$(dirname "$dll")"/*.dll "$(dirname "$dll")"/*.pdb; do
              [ -e "$WORK/$N/$(basename "$dep")" ] || ln -s "$GITHUB_WORKSPACE/$dep" "$WORK/$N/"
            done
            printf '%s|%s\n' "$N" "$dll" >> "$RUNNER_TEMP/instrument-reps.txt"
          done
          echo "prepared $N distinct blobs, skipped $SKIPPED without symbols"

          cat > "$RUNNER_TEMP/instrument.sh" <<'SCRIPT'
          set -euo pipefail
          : > "$RUNNER_TEMP/instrument-failed.txt"
          xargs -a "$RUNNER_TEMP/instrument-reps.txt" -d '\n' -P "$(nproc)" -I{} bash -c '
            n=${1%%|*}; path=${1#*|}
            name=$(basename "$path")
            if dotnet-coverage instrument "$WORK/$n/$name" --session-id "$SESSION_ID" --nologo -dco; then
              mkdir -p "$STAGE/$(dirname "$path")"
              mv "$WORK/$n/$name" "$STAGE/$path"
              mv "$WORK/$n/${name%.dll}.pdb" "$STAGE/${path%.dll}.pdb"
            else
              printf "%s\n" "$path" >> "$RUNNER_TEMP/instrument-failed.txt"
            fi' _ {}

          # A blob that failed never reaches the overlay, so the test job keeps its clean
          # copy; so do its twins, below.
          while read -r dll; do echo "::warning::could not instrument $dll"; done < "$RUNNER_TEMP/instrument-failed.txt"

          COPIED=0
          while IFS=$'\t' read -r rep twin; do
            [ -f "$STAGE/$rep" ] || continue   # its representative failed: the twin stays clean
            mkdir -p "$STAGE/$(dirname "$twin")"
            cp -f "$STAGE/$rep" "$STAGE/$twin"
            cp -f "$STAGE/${rep%.dll}.pdb" "$STAGE/${twin%.dll}.pdb"
            COPIED=$((COPIED+1))
          done < "$RUNNER_TEMP/instrument-twins.txt"

          INSTRUMENTED=$(( $(wc -l < "$RUNNER_TEMP/instrument-reps.txt") - $(wc -l < "$RUNNER_TEMP/instrument-failed.txt") ))
          echo "=== instrumented $INSTRUMENTED blobs, copied to $COPIED duplicates ==="
          if [ "$INSTRUMENTED" -eq 0 ]; then
            echo "::error::Nothing was instrumented. Every test job would collect empty coverage."
            exit 1
          fi
          SCRIPT
          export STAGE SESSION_ID WORK
          # The exit code is written only when the script ends, so the wait step can tell
          # "finished" from "still running" and never mistakes a crash for success.
          # shellcheck disable=SC2016  # expanded by the inner bash, not here
          nohup bash -c 'bash "$RUNNER_TEMP/instrument.sh"; echo $? > "$RUNNER_TEMP/instrument.exit"' \
            > "$RUNNER_TEMP/instrument.log" 2>&1 &
          echo "instrumentation started (pid $!)"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Test jobs execute test modules directly from bin/ (Run-Tests.ps1 -NoBuild uses
          # --test-modules, no MSBuild), so only PACKABLE projects (src/ + tools/: CLI,
          # Migrate) need obj/ intermediates for pack's dotnet pack --no-build.
          # Test/sample/benchmark intermediates are dead weight in the artifact.
          name: build-${{ github.run_id }}
          path: |
            **/bin/Release
            src/**/obj/Release
            tools/**/obj/Release
            !**/obj/Release/**/ref/**
            !**/obj/Release/**/refint/**
          # A release branch's build is repacked for its beta and rc prereleases
          # (release-prerelease.yml), so it lives as long as the release PR might stay open.
          retention-days: ${{ startsWith(github.ref, 'refs/heads/release/v') && 7 || 1 }}
          # Level 1, measured: level 6 spent ~190s compressing 1.9 GB; level 0 uploaded 5.5 GB
          # in 60s but up to 2 minutes slower downloads in the 11 test jobs that fetch it.
          compression-level: 1

      - name: Wait for coverage instrumentation
        run: |
          set -euo pipefail
          for _ in $(seq 1 600); do
            [ -f "$RUNNER_TEMP/instrument.exit" ] && break
            sleep 1
          done
          cat "$RUNNER_TEMP/instrument.log"
          if [ ! -f "$RUNNER_TEMP/instrument.exit" ]; then
            echo "::error::Coverage instrumentation did not finish within 10 minutes of the upload."
            exit 1
          fi
          exit "$(cat "$RUNNER_TEMP/instrument.exit")"

      # Guard: instrumentation writes only to the staging folder, so every packable output
      # must still match the hash taken before it started. A future edit that instruments in
      # place would quietly start shipping instrumented assemblies to NuGet; this fails first.
      - name: Verify packable output was not instrumented
        run: |
          set -euo pipefail
          if ! sha256sum --quiet -c build-determinism/assemblies.sha256; then
            echo "::error::src/ or tools/ output changed after it was hashed. Pack would ship it to NuGet."
            exit 1
          fi
          echo "packable output is clean ($(wc -l < build-determinism/assemblies.sha256) assemblies)"

      - name: Upload Instrumented Assemblies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Overlay only: the instrumented DLLs at their original relative paths (the staging
          # folder is the artifact's root). Keeps a second full artifact off the wire.
          name: build-instrumented-${{ github.run_id }}
          path: ${{ runner.temp }}/coverage-overlay/
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
