name: Build (Reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Where the job runs, as JSON: a label ("ubuntu-latest") or a label set (["self-hosted","whizbang","Linux","X64"]).
          CI passes the runner picker's choice (.github/scripts/Select-CiRunner.ps1); every other caller gets ubuntu-latest.
        type: string
        required: false
        default: '"ubuntu-latest"'
      version:
        description: 'Version to stamp into assemblies (from GitVersion). If empty, uses Directory.Build.props default.'
        required: false
        type: string
        default: ''
      run-analyzers:
        description: >-
          Run the Roslyn analyzers during the build. CI turns them off here and enforces them in its separate
          Build · Analyzers job, off the suites' critical path (#2068). Source generators run either way: the
          compiler's /skipanalyzers skips diagnostic analyzers only.
        required: false
        type: boolean
        default: true
      integration-slices:
        description: >-
          Upload the integration suites' slices. False on a pull request into develop, which runs only the unit
          and component suites (the integration suites run in the merge queue).
        required: false
        type: boolean
        default: true
      upload-slices:
        description: >-
          Upload the per-suite build slices. False when no suite will run in this run (a push that reuses an
          already-tested run's results), so nothing would download them.
        required: false
        type: boolean
        default: true
    outputs:
      test-frameworks:
        description: >-
          The target frameworks the tests were built for, as a JSON array: ["net10.0","net11.0"] on a release build,
          ["net11.0"] otherwise. Each suite runs one leg per framework (#2427).
        value: ${{ jobs.build.outputs.test-frameworks }}
      sample-test-frameworks:
        description: >-
          The target frameworks the sample tests were built for, as a JSON array: samples/ECommerce/Directory.Build.props
          pins its own, ["net11.0"] on every branch. A suite leg that selects only sample tests runs one leg per
          framework in this list instead (#2427).
        value: ${{ jobs.build.outputs.sample-test-frameworks }}

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NOLOGO: '1'

# The repository default is read-only; stated here so no job can silently gain more.
permissions:
  contents: read

jobs:
  build:
    name: Compile and hash
    runs-on: ${{ fromJSON(inputs.runs-on || '"ubuntu-latest"') }}
    # With the analyzers on (any caller but CI) they roughly double the solution build on a hosted
    # runner (16 minutes observed); the artifact upload follows it.
    timeout-minutes: 50
    outputs:
      test-frameworks: ${{ steps.frameworks.outputs.test-frameworks }}
      sample-test-frameworks: ${{ steps.frameworks.outputs.sample-test-frameworks }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-retry
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Display .NET Info
        run: dotnet --info

      # Directory.Build.props decides the frameworks from the branch (WhizbangReleaseBuild), as Run-Tests.ps1 reads
      # them, so the suites split into the same frameworks this build compiles. The samples' own props pin theirs.
      - name: Name the frameworks the tests target
        id: frameworks
        shell: pwsh
        run: |
          foreach ($output in @(
              @{ Name = 'test-frameworks'; Props = 'Directory.Build.props' },
              @{ Name = 'sample-test-frameworks'; Props = 'samples/ECommerce/Directory.Build.props' })) {
            $evaluated = ((dotnet msbuild $output.Props -getProperty:TargetFramework -getProperty:TargetFrameworks) | Out-String | ConvertFrom-Json).Properties
            $frameworks = @("$($evaluated.TargetFrameworks);$($evaluated.TargetFramework)" -split ';' |
                ForEach-Object { $_.Trim() } | Where-Object { $_ } | Select-Object -Unique)
            if ($frameworks.Count -eq 0) { throw "Could not read the target frameworks from $($output.Props)." }
            $json = ConvertTo-Json -Compress -InputObject $frameworks
            Write-Host "$($output.Name): $json"
            "$($output.Name)=$json" >> $env:GITHUB_OUTPUT
          }

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore --locked-mode

      - name: Build Solution
        env:
          # Env-var indirection (githubactions:S7630): never interpolate workflow inputs
          # directly into a run block — the shell sees only the variable, not the value.
          VERSION: ${{ inputs.version }}
          RUN_ANALYZERS: ${{ inputs.run-analyzers }}
          # The compiler server runs server GC and holds on to what one project's compile grew to while it compiles the
          # next, so the largest test projects stack: a cold full build peaked at 19.3 GB. Told to conserve memory it
          # compacts instead, and the same build peaked at 12.8 GB (#2388).
          DOTNET_GCConserveMemory: '7'
        run: |
          # One build node and no -mt: the libraries build net10.0 and net11.0, and with two nodes the hosted runner ran
          # out of memory and was shut down mid-build in the merge queue (#2135), as the other full builds were.
          BUILD_ARGS=(--no-restore --configuration Release -mt:false -maxcpucount:1 -nodeReuse:false)
          if [ -n "$VERSION" ]; then BUILD_ARGS+=("-p:Version=$VERSION"); fi
          # Analyzers change no output: every assembly, and so the determinism manifest, is the same either way.
          if [ "$RUN_ANALYZERS" != true ]; then BUILD_ARGS+=("-p:RunAnalyzers=false"); fi
          # A hosted runner has 16 GB, and a build that needs more hangs until the job times out with no log (#2388).
          # The guard samples the build's processes and the compiler server while the build runs and fails a build whose
          # peak passes 13 GB, 3 GB under the runner, so growth shows up as a failed check while there is still room
          # to find it. Measured cold on develop after #2388: this build 9.7 GB with the analyzers off, 11.6 GB as the
          # Analyzers job runs it. The command goes through a file,
          # one argument a line, because pwsh -File would split an argument such as -mt:false.
          BUILD_COMMAND="$RUNNER_TEMP/build-command"
          printf '%s\n' dotnet build "${BUILD_ARGS[@]}" > "$BUILD_COMMAND"
          pwsh -NoProfile -File .github/scripts/Invoke-BuildWithinMemory.ps1 -BudgetMb 13312 -CommandFile "$BUILD_COMMAND"

      # Formatting verification runs as a separate parallel job (ci.yml `format`) so it
      # stays off the build -> test-suites critical path.

      # Determinism manifest: sha256 of every packable output (src/ + tools/), plus the
      # exact version and SDK that produced them. A later develop-push run that skips its test matrix because
      # the merge queue already validated this exact SHA proves "same toolchain, same
      # bits" by rebuilding with this manifest's version and diffing hashes — see
      # ci.yml's verify-rebuild job. Cheap enough to run unconditionally.
      # NOTE: the output directory must NOT be dot-prefixed. actions/upload-artifact v4+
      # defaults include-hidden-files: false and silently excludes a hidden directory's
      # entire contents ("No files were found with the provided path"), so a `.determinism/`
      # dir uploaded NOTHING while the step still reported success — leaving verify-rebuild
      # with no manifest and blocking every develop alpha. Keep this name non-hidden.
      - name: Generate determinism manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build-determinism
          printf '%s' "${VERSION:-}" > build-determinism/version.txt
          dotnet --version > build-determinism/sdk.txt
          find src tools -path "*/bin/Release/*" \( -name "*.dll" -o -name "*.exe" \) -type f \
            ! -path "*/ref/*" | sort | xargs sha256sum > build-determinism/assemblies.sha256
          echo "hashed $(wc -l < build-determinism/assemblies.sha256) assemblies at version '${VERSION:-<props default>}'"

      - name: Upload determinism manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: determinism-manifest-${{ github.run_id }}
          path: build-determinism/
          # Fail loudly instead of warning: a missing manifest here silently blocks every
          # queue-validated develop publish downstream (verify-rebuild has nothing to check).
          if-no-files-found: error
          retention-days: 3

      # No coverage step here. Test jobs collect coverage themselves, with Microsoft.Testing.Platform's
      # dynamic collector inside each test process (Run-Tests.ps1 -ModuleCoverage), which records
      # branches as well as lines. This job used to rewrite tests/ and samples/ copies of the
      # assemblies with `dotnet-coverage instrument` and ship them as an overlay artifact; static
      # instrumentation records lines only, so every report claimed full branch coverage with no
      # conditions behind it. The dynamic collector instruments in memory and writes nothing to
      # disk, and the test jobs run on their own download of this artifact, so nothing pack
      # consumes can carry instrumentation.
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Test jobs execute test modules directly from bin/ (Run-Tests.ps1 -NoBuild uses
          # --test-modules, no MSBuild), so only PACKABLE projects (src/ + tools/: CLI,
          # Migrate) need obj/ intermediates for pack's dotnet pack --no-build.
          # Test/sample/benchmark intermediates are dead weight in the artifact.
          name: build-${{ github.run_id }}
          path: |
            **/bin/Release
            src/**/obj/Release
            tools/**/obj/Release
            !**/obj/Release/**/ref/**
            !**/obj/Release/**/refint/**
          # A release branch's build is repacked for its beta and rc prereleases
          # (release-prerelease.yml), so it lives as long as the release PR might stay open.
          retention-days: ${{ startsWith(github.ref, 'refs/heads/release/v') && 7 || 1 }}
          # Level 1, measured: level 6 spent ~190s compressing 1.9 GB; level 0 uploaded 5.5 GB
          # in 60s but up to 2 minutes slower downloads in the 11 test jobs that fetch it.
          compression-level: 1
          # Each test project's output holds a hidden .msCoverageExtensionSourceRootsMapping_<name>
          # file that maps the deterministic /_/ source paths in its pdbs back to the checkout.
          # Without it the coverage collector finds none of an assembly's sources, skips the
          # assembly, and writes an empty report while every test still passes; upload-artifact
          # drops hidden files unless told otherwise. The mapping names THIS job's checkout, so every
          # test job that downloads the build rewrites it first with
          # .github/scripts/Update-CoverageSourceRoots.ps1, whatever runner it lands on: a GitHub-hosted
          # build and self-hosted suites check out at different paths (#1948), and
          # TestSuiteSourceRoots.Tests.ps1 fails a suite that skips it. The only other hidden files
          # under these paths are obj/'s generated AssemblyAttributes sources.
          include-hidden-files: true

      # Per-suite slices. Every test job downloaded the whole build above (about 2.4 GB) though an
      # integration suite runs one or two projects, and the download took anywhere from 40 seconds
      # to over 5 minutes. A test project's bin/Release holds its whole dependency closure, so each
      # suite gets only its projects' output; the unit suite too, since #2068 (it spent 4.2 minutes
      # downloading for 1.5 minutes of tests). The full build above is what pack reads. The slices are
      # derived from the projects' types and tags, the same way Run-Tests.ps1 selects them, and a
      # slice missing a selected project fails that suite.
      - name: Define per-suite build slices
        if: inputs.upload-slices
        id: slices
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/Get-TestSlice.ps1 -GitHubOutput

      - name: Upload build slice (postgres)
        if: inputs.upload-slices && inputs.integration-slices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-postgres-${{ github.run_id }}
          path: ${{ steps.slices.outputs.postgres }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          include-hidden-files: true   # the coverage source-root mapping files (see the full upload)

      - name: Upload build slice (inmemory)
        if: inputs.upload-slices && inputs.integration-slices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-inmemory-${{ github.run_id }}
          path: ${{ steps.slices.outputs.inmemory }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          include-hidden-files: true   # the coverage source-root mapping files (see the full upload)

      - name: Upload build slice (rabbitmq)
        if: inputs.upload-slices && inputs.integration-slices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-rabbitmq-${{ github.run_id }}
          path: ${{ steps.slices.outputs.rabbitmq }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          include-hidden-files: true   # the coverage source-root mapping files (see the full upload)

      - name: Upload build slice (servicebus)
        if: inputs.upload-slices && inputs.integration-slices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-servicebus-${{ github.run_id }}
          path: ${{ steps.slices.outputs.servicebus }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          include-hidden-files: true   # the coverage source-root mapping files (see the full upload)

      - name: Upload build slice (integration)
        if: inputs.upload-slices && inputs.integration-slices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-integration-${{ github.run_id }}
          path: ${{ steps.slices.outputs.integration }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          include-hidden-files: true   # the coverage source-root mapping files (see the full upload)

      - name: Upload build slice (component)
        if: inputs.upload-slices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-component-${{ github.run_id }}
          path: ${{ steps.slices.outputs.component }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          include-hidden-files: true   # the coverage source-root mapping files (see the full upload)

      - name: Upload build slice (unit)
        if: inputs.upload-slices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-unit-${{ github.run_id }}
          path: ${{ steps.slices.outputs.unit }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          include-hidden-files: true   # the coverage source-root mapping files (see the full upload)

      - name: Upload build slice (azureblob)
        if: inputs.upload-slices && inputs.integration-slices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-azureblob-${{ github.run_id }}
          path: ${{ steps.slices.outputs.azureblob }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          include-hidden-files: true   # the coverage source-root mapping files (see the full upload)

      # Guard: every packable output must still match the hash taken right after the build, so no
      # step in this job (today none does) rewrote what pack ships. A future step that instruments
      # or patches assemblies in place would quietly start shipping them to NuGet; this fails first.
      - name: Verify packable output is unchanged since it was hashed
        run: |
          set -euo pipefail
          if ! sha256sum --quiet -c build-determinism/assemblies.sha256; then
            echo "::error::src/ or tools/ output changed after it was hashed. Pack would ship it to NuGet."
            exit 1
          fi
          echo "packable output is clean ($(wc -l < build-determinism/assemblies.sha256) assemblies)"
