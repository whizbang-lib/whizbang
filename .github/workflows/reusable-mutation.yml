name: Mutation Testing (Reusable)

on:
  workflow_call:
    inputs:
      project:
        description: 'Source project to mutate (e.g., Whizbang.Core)'
        type: string
        required: false
        default: 'Whizbang.Core'
      mutate-filter:
        description: 'File glob filter for mutation (empty = all files)'
        type: string
        required: false
        default: ''
      since-target:
        description: 'Git target for diff-based mutation (empty = full run)'
        type: string
        required: false
        default: ''

jobs:
  mutation:
    name: Mutation Testing - ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Tools
        run: dotnet tool restore

      - name: Run Mutation Tests
        shell: pwsh
        run: |
          $args = @('-Project', '${{ inputs.project }}')

          if ('${{ inputs.mutate-filter }}') {
            $args += @('-Mutate', '${{ inputs.mutate-filter }}')
          }

          if ('${{ inputs.since-target }}') {
            $args += @('-Since', '${{ inputs.since-target }}')
          }

          & pwsh scripts/mutation/run-mutation-tests.ps1 @args

      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mutation-report-${{ inputs.project }}
          path: '**/StrykerOutput/**/reports/**'
          retention-days: 7
          if-no-files-found: ignore
