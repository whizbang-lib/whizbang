name: CI

# Without this, a run is titled after its commit, and a post-merge run on develop is therefore
# titled "Merge pull request #NNN from ..." -- which reads as though the run IS the merge. It is
# not: it starts seconds AFTER the merge has already landed, and canceling it cannot undo
# anything, it only abandons whatever the run had left to do (for develop, that is the prerelease
# publish). Saying which event this is, up front, is the difference.
#
# A release branch is the exception that proves it. Its push run is the release CUT: the branch is
# created before anything merges, and that run is the one the release pull request is gated on and
# the only one that publishes. Calling it post-merge says the opposite of what is true, on the one
# branch where somebody reading the list is deciding whether it is safe to merge.
run-name: >-
  CI ${{ github.event_name == 'pull_request' && format('· PR #{0} · {1}', github.event.pull_request.number, github.head_ref)
      || github.event_name == 'merge_group' && '· merge queue'
      || github.event_name == 'workflow_dispatch' && format('· manual · {0}', github.ref_name)
      || startsWith(github.ref, 'refs/heads/release/v') && format('· release cut · {0}', github.ref_name)
      || format('· post-merge · {0}', github.ref_name) }}

on:
  push:
    branches:
      - develop        # alpha channel: the prerelease-publish job
      - main           # a release landing here is what analyzes the main line (see below)
      - 'release/v**'  # branch-name-versioned publish (release-publish job)
  pull_request:
    branches: [main, develop, 'release/**']
  merge_group:       # the queue's own run, on the prospective merge commit
  workflow_dispatch:

# WHY main IS A PUSH TRIGGER: reusable-quality.yml has always had a main-branch shape — its
# scanner steps run on a pull request OR a push to main, and for the latter it omits
# sonar.branch.name so SonarCloud records the analysis as the main line. Nothing ever produced
# that push: release.yml merges the release PR and calls no quality workflow, so main went
# unanalyzed from one release to the next and the badge kept reporting a months-old verdict on
# months-old code. Main receives one merge per release, so this costs one matrix per release, and
# every publish job here is guarded to develop or release/** and cannot fire from it.

# Least-privilege: NO workflow-level grants (S8233/S8264) — every job declares exactly
# what it needs. Only the publish jobs get contents/id-token write, and only
# version-comment gets pull-requests write.
permissions: {}

concurrency:
  # Include event_name so a release-branch PUSH run and the release PR run land in
  # DIFFERENT groups. Start-Release pushes release/v** (push event) AND opens the
  # release PR (pull_request event) at the same SHA; with a shared group the PR run's
  # cancel-in-progress killed the push run, leaving a spurious "CI Result: FAILURE"
  # that blocked the release merge — violating "a publish must never be cancelled
  # mid-push". Same-branch PR supersession still works: all pull_request runs for a
  # branch share one group keyed by head_ref, so a new commit cancels the older PR run.
  #
  # PUSH runs are keyed by SHA, so every pushed commit gets its OWN group and can never be
  # displaced by a later push. cancel-in-progress: false is NOT sufficient on its own — it
  # prevents canceling a RUNNING run, but GitHub keeps at most ONE pending run per group, so
  # a third push arriving while one run is executing and another is queued EVICTS the queued
  # one. That run is cancelled before it starts (tell-tale: total_jobs = 0), and because
  # Detect Changes scopes publish to the pushed commit, the evicted commit's packages are
  # never published — with every workflow reporting green. Keying by SHA removes the shared
  # queue slot that made that possible (issue #539).
  #
  # PULL_REQUEST runs stay keyed by head_ref so a new commit still supersedes the older run
  # for that branch, which is the behavior supersession exists for.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  # PRs cancel superseded runs; pushes never cancel — a publish must not be lost, whether by
  # being cancelled mid-run or evicted from the queue before it starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # merge_group has no base ref to diff against, so the filter is skipped there and
      # every code-gated job forces itself on instead. A queue run must never narrow its
      # own matrix: the filter returning empty would skip the suites, CI Result would go
      # green on nothing, and the queue would merge untested code.
      - name: Detect changed paths
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            code:
              # Workflow/script changes must run the full matrix — they can break the
              # build/test/publish contracts they define (a workflow-only PR otherwise
              # skips the very checks that validate it).
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
              - 'src/**'
              - 'tests/**'
              - 'samples/**'
              - 'tools/**'
              - 'benchmarks/**'
              - '*.sln*'
              - '**/*.csproj'
              - '**/*.props'
              - '**/*.targets'
              - 'Directory.Build.*'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'nuget.config'

  # ============================================================================
  # Queue-validated push optimization
  #
  # The merge queue fast-forwards develop to the EXACT SHA it just ran the full
  # matrix on, so the post-merge push run re-testing that SHA is pure redundancy
  # (~35-40 min per merge). When a successful merge_group CI run exists for this
  # SHA, the suites and quality skip; the publish gate then requires
  # verify-rebuild instead — a same-SDK rebuild at the queue's version whose
  # assembly hashes must match the queue's manifest, byte-for-byte outside a small
  # documented allowlist of upstream nondeterminism (see the job), proving "same
  # source, same toolchain; only the stamped version differs" for the packed bits.
  # reupload-reports republishes the queue run's coverage + TRX into this run so
  # the Codecov develop baseline and the docs test-status keep flowing unchanged.
  #
  # Escape hatch: set repo variable PUSH_RUN_FULL_MATRIX=true and re-run all jobs
  # to force the full matrix (e.g. after an SDK patch lands between queue and push
  # and verify-rebuild refuses the drifted rebuild).
  # ============================================================================

  queue-validated:
    name: Queue Validation Check
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      vars.PUSH_RUN_FULL_MATRIX != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      validated: ${{ steps.check.outputs.validated }}
      queue-run-id: ${{ steps.check.outputs.queue_run_id }}
    steps:
      - name: Look for a successful merge_group CI run on this exact SHA
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A run's conclusion is success only when every job succeeded or was
          # deliberately skipped — on queue refs that includes the full matrix AND the
          # quality gate, which run unconditionally there. Same SHA = same tree = same
          # workflow files, so that green fully validated these exact bytes.
          # The WORKFLOW endpoint, not the runs endpoint filtered by name: a run's .name is its
          # run-name, and this workflow sets one (see run-name above), so a run of this file is
          # named "CI - merge queue" or "CI - PR #N - branch" and never plain "CI". Filtering on
          # .name silently matched nothing, which left this gate answering "not validated" on
          # every push and the whole matrix running a second time after the queue had already
          # run it. Addressing ci.yml by path cannot drift with the run-name.
          RUN_ID=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=merge_group&status=success&per_page=10" \
            --jq '.workflow_runs[0].id // ""')
          if [ -n "$RUN_ID" ]; then
            echo "Queue run $RUN_ID validated $SHA — skipping the redundant push matrix."
            echo "Queue-validated: **true** -- run $RUN_ID already validated $SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "validated=true" >> "$GITHUB_OUTPUT"
            echo "queue_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "No successful merge_group CI run for $SHA — running the full matrix."
            echo "Queue-validated: **false** -- no successful queue run for $SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "validated=false" >> "$GITHUB_OUTPUT"
            echo "queue_run_id=" >> "$GITHUB_OUTPUT"
          fi

  release-pr:
    name: Release PR Duplicate Check
    # start-release pushes release/v** AND opens the release PR at the SAME commit, so two runs
    # of this workflow cover identical bytes: the push run, which must run the matrix because it
    # publishes, and the PR run, which gates the merge to main. Both ran everything — two builds,
    # two Sonar analyses and two integration matrices per release cut, over one tree.
    #
    # The PR run yields EVERY job that costs a runner: format, build, quality and the six suites.
    # Yielding only the suites left the two most expensive jobs still doubled, because build and
    # quality are gated on their own change filter rather than on the matrix's. What remains
    # doubled is the handful of jobs that resolve an expression and stop (Detect Changes, and the
    # event-exclusive guards that skip here anyway), which cost seconds, not minutes.
    #
    # The push run's results are what the merge reads, and they are the same check NAMES on the
    # same commit, so a ruleset on main would read them either way.
    #
    # Why yielding is safe in this direction and not the other: these jobs are skipped by an
    # expression, which resolves in seconds, while the push run's real results land minutes later
    # and therefore win as the last report for each name. Skipping the PUSH run instead would put
    # a fast "skipped" after a slow real result and could mask a failure — and would also strand
    # the publish, which only the push event performs (see release-publish).
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'release/v') &&
      vars.RELEASE_PR_FULL_MATRIX != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Is the push run for this same commit already covering it?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Addressed by workflow PATH, not by name: this workflow sets a run-name, so a run of
          # this file is never named plain "CI" and filtering on .name matches nothing — the same
          # trap queue-validated documents above.
          RUN_ID=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=10" \
            --jq '.workflow_runs[0].id // ""')
          if [ -n "$RUN_ID" ]; then
            echo "Push run $RUN_ID covers $SHA — the PR run yields the matrix to it."
            echo "Release-PR duplicate: **true** -- push run $RUN_ID covers $SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            # No push run means nothing else is testing this commit, so the PR run does it.
            echo "No push run for $SHA — the PR run keeps the matrix."
            echo "Release-PR duplicate: **false** -- no push run for $SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  verify-rebuild:
    name: Verify Deterministic Rebuild
    # The hardened half of the skip: rebuild on the QUEUE's exact SDK at the QUEUE's
    # version and confirm the SAME assembly SET. That plus the shared commit SHA is the
    # safety argument for publishing queue-validated bits unre-tested: identical source +
    # identical toolchain ⇒ identical behavior to what the suites tested. SDK drift or a
    # changed assembly set keep the publish gate closed. Byte-identity is NOT gated —
    # source generators emit nondeterministically for an unpredictable subset of
    # assemblies (see the compare step); tamper-evidence is the SLSA provenance
    # attestation on the published bits, not this rebuild.
    needs: [queue-validated]
    if: ${{ !failure() && !cancelled() && needs.queue-validated.outputs.validated == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-retry
        with:
          dotnet-version: '10.0.x'

      - name: Download queue run's determinism manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          QUEUE_RUN_ID: ${{ needs.queue-validated.outputs.queue-run-id }}
        run: |
          set -euo pipefail
          ART_ID=$(gh api "repos/$REPO/actions/runs/$QUEUE_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | startswith("determinism-manifest-"))][0].id // ""')
          if [ -z "$ART_ID" ]; then
            echo "::error::Queue run $QUEUE_RUN_ID published no determinism manifest — cannot verify the rebuild."
            exit 1
          fi
          gh api "repos/$REPO/actions/artifacts/$ART_ID/zip" > manifest.zip
          mkdir -p queue-manifest && unzip -o -q manifest.zip -d queue-manifest
          echo "queue built version '$(cat queue-manifest/version.txt)' on SDK $(cat queue-manifest/sdk.txt): $(wc -l < queue-manifest/assemblies.sha256) assemblies"

      # The toolchain must be EXACTLY the queue's: with a different SDK even benign
      # hash differences lose their explanation, so drift fails closed before building.
      - name: Require the queue's exact SDK
        run: |
          set -euo pipefail
          QUEUE_SDK=$(cat queue-manifest/sdk.txt)
          LOCAL_SDK=$(dotnet --version)
          if [ "$QUEUE_SDK" != "$LOCAL_SDK" ]; then
            echo "::error::SDK drift between the queue run ($QUEUE_SDK) and this push run ($LOCAL_SDK) — the rebuild cannot be verified. Set repo variable PUSH_RUN_FULL_MATRIX=true and re-run all jobs to run the full matrix instead."
            exit 1
          fi
          echo "SDK matches the queue run: $LOCAL_SDK"

      - name: Rebuild at the queue's version and verify the assembly set
        run: |
          set -euo pipefail
          QUEUE_VERSION=$(cat queue-manifest/version.txt)
          dotnet restore
          BUILD_ARGS=(--no-restore --configuration Release)
          if [ -n "$QUEUE_VERSION" ]; then BUILD_ARGS+=("-p:Version=$QUEUE_VERSION"); fi
          dotnet build "${BUILD_ARGS[@]}"
          find src tools -path "*/bin/Release/*" \( -name "*.dll" -o -name "*.exe" \) -type f \
            ! -path "*/ref/*" | sort | xargs sha256sum > rebuilt.sha256

          # HARD GATE: the queue built the SAME assemblies we did, on the SAME SDK (checked
          # above), from the SAME commit (the push and queue are the same SHA). That triad
          # is the safety argument for publishing queue-validated bits without re-running the
          # suites: identical source + identical toolchain ⇒ identical BEHAVIOR to what the
          # suites tested. An added/removed assembly means the structure diverged — refuse.
          awk '{print $2 " " $1}' queue-manifest/assemblies.sha256 | sort > queue.kv
          awk '{print $2 " " $1}' rebuilt.sha256 | sort > local.kv
          if ! diff -u <(cut -d' ' -f1 queue.kv) <(cut -d' ' -f1 local.kv); then
            echo "::error::The SET of built assemblies differs from the queue run — refusing to publish."
            exit 1
          fi

          # INFORMATIONAL: byte-identity is NOT a gate. Source generators emit
          # nondeterministically — [LoggerMessage] partial-class ordering and ILRepack MVIDs
          # shift hashes for an UNPREDICTABLE subset of assemblies each build, so a byte
          # comparison flakes and a name allowlist can never be complete (that fragility
          # blocked a publish; see #691). Tamper-evidence for the actually-published bits is
          # the SLSA provenance attestation (nuget-push.yml), not this rebuild. Report the
          # match rate for monitoring; do not fail on it.
          DIFFERING=$(join queue.kv local.kv | awk '$2 != $3' | wc -l)
          TOTAL=$(wc -l < local.kv)
          echo "Assembly set matches the queue run ($TOTAL assemblies). Byte-identical: $((TOTAL - DIFFERING)); differing (generator nondeterminism, informational): $DIFFERING."
          if [ "$DIFFERING" -gt 0 ]; then
            echo "Differing assemblies (expected — LoggerMessage/ILRepack ordering):"
            join queue.kv local.kv | awk '$2 != $3 {print "  " $1}'
          fi

  reupload-reports:
    name: Republish Queue Run Reports
    # With the suites skipped, this run would otherwise upload no coverage (the
    # Codecov develop baseline PR comparisons rely on) and carry no TRX (the docs
    # test-status and Codecov Test Analytics inputs). Republish the full-matrix run's
    # artifacts in THIS run so every downstream consumer keeps working unchanged.
    #
    # SOURCE RUN: normally the queue run for this SHA. But on a FAST-FORWARD merge the
    # queue run itself ff-skipped its suites (ff-validated) and produced no coverage/TRX
    # — there the full matrix ran in the PR run, so we fall back to it (the push merge
    # commit's second parent is the PR head). Real merges keep using the queue run.
    needs: [queue-validated]
    if: ${{ !failure() && !cancelled() && needs.queue-validated.outputs.validated == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout (for the merge commit's PR-head parent)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Download the full-matrix run's coverage and TRX artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          QUEUE_RUN_ID: ${{ needs.queue-validated.outputs.queue-run-id }}
        run: |
          set -euo pipefail

          list_reports() {  # $1 = run id → writes "id name" lines for coverage-*/trx-*
            gh api "repos/$REPO/actions/runs/$1/artifacts?per_page=100" \
              --jq '.artifacts[] | select((.name | startswith("coverage-")) or (.name | startswith("trx-"))) | "\(.id) \(.name)"'
          }

          # Prefer the queue run. If it ff-skipped its suites (fast-forward), it has no
          # coverage — fall back to the PR run that actually ran the full matrix, found via
          # the merge commit's second parent (the PR head).
          list_reports "$QUEUE_RUN_ID" > artifacts.list || true
          SOURCE="queue run $QUEUE_RUN_ID"
          if ! grep -q " coverage-" artifacts.list; then
            PR_HEAD=$(git rev-list --parents -n 1 HEAD | awk '{print $3}')
            if [ -n "${PR_HEAD:-}" ]; then
              # Addressed by path rather than by name: see the note in queue-validated.
              PR_RUN=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$PR_HEAD&event=pull_request&per_page=30" \
                --jq '[.workflow_runs[] | select(.status == "completed")]
                      | sort_by(.run_started_at) | last | .id // ""' 2>/dev/null || echo "")
              if [ -n "$PR_RUN" ]; then
                echo "Queue run had no coverage (fast-forward ff-skip) — falling back to PR run $PR_RUN for $PR_HEAD."
                list_reports "$PR_RUN" > artifacts.list || true
                SOURCE="PR run $PR_RUN"
              fi
            fi
          fi

          if ! grep -q " coverage-" artifacts.list; then
            echo "::error::No coverage artifacts on the queue run OR the PR run — Codecov's develop baseline would go dark."
            exit 1
          fi
          mkdir -p coverage trx
          while read -r ID NAME; do
            gh api "repos/$REPO/actions/artifacts/$ID/zip" > art.zip
            case "$NAME" in
              coverage-*) mkdir -p "coverage/$NAME" && unzip -o -q art.zip -d "coverage/$NAME" ;;
              trx-*)      mkdir -p "trx/$NAME"      && unzip -o -q art.zip -d "trx/$NAME" ;;
            esac
            rm art.zip
          done < artifacts.list
          echo "republishing $(wc -l < artifacts.list) artifacts from $SOURCE: $(find coverage -name '*.cobertura.xml' | wc -l) coverage files, $(find trx -name '*.trx' | wc -l) TRX files"

      # Same upload shape as the quality job's step, so Codecov's develop baseline is
      # indistinguishable from a full-matrix push run.
      - name: Upload Merged Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          files: '**/*.cobertura.xml'
          fail_ci_if_error: false
          flags: alltests
          name: codecov-merged

      # trx-* pattern consumers (publish-test-status, test-results) pick this up like
      # any suite's artifact; per-suite subdirectories prevent same-name collisions.
      - name: Republish TRX for downstream jobs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: trx-queue
          path: trx/
          retention-days: 1
          if-no-files-found: warn

  # ============================================================================
  # Fast-forward queue-skip optimization (companion to queue-validated above)
  #
  # queue-validated removes the redundant POST-merge develop push run. This removes
  # the redundant IN-QUEUE run for the ~1/3 of merges that are FAST-FORWARDS — a
  # single PR whose branch already contains the current develop tip, so the queue's
  # prospective-merge commit has a tree byte-identical to what the PR run already
  # tested fully. In that case the six suites and quality skip here; the queue's
  # Build still runs (unconditionally) so the determinism manifest exists for the
  # push run's verify-rebuild. On a real merge (develop moved) or a batched queue
  # group, the guard falls through to the full queue matrix — the queue's whole
  # purpose. Fails safe: any uncertainty runs the full matrix.
  #
  # Combined with queue-validated: a fast-forward merge runs ONE full matrix (the PR
  # run); a real merge runs two (PR + queue). Escape hatch: repo variable
  # QUEUE_RUN_FULL_MATRIX=true forces the full queue matrix.
  # ============================================================================
  ff-validated:
    name: Fast-Forward Validation Check
    if: github.event_name == 'merge_group' && vars.QUEUE_RUN_FULL_MATRIX != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout the queue commit with its parents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # depth 2 brings the merge commit plus both parents (and their trees), which is
          # all the tree comparison needs — no full history fetch.
          fetch-depth: 2

      - name: Was this exact tree already validated by the PR run?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          # NOTE: no `set -e`. Every exit path emits skip and returns 0, so the guard can
          # never fail the run — the worst case is skip=false (the full queue matrix).
          set -uo pipefail
          # Also written to the run summary. The verdict decides whether the whole matrix runs
          # again, so "why did the queue re-run everything" has to be answerable at a glance
          # rather than by reading this job's log.
          emit() {
            echo "skip=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
            echo "Fast-forward skip: **$1** -- $2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          read -r _COMMIT P1 P2 P3 < <(git rev-list --parents -n 1 HEAD) \
            || emit false "cannot read the queue commit's parents — full matrix"
          # A single-PR queue group is a 2-parent merge (base + one PR head). More parents
          # means a batched group, which the PR runs did NOT test as-merged — full matrix.
          if [ -z "${P2:-}" ] || [ -n "${P3:-}" ]; then
            emit false "queue commit is not a single-PR merge (parents: ${P1:-} ${P2:-} ${P3:-}) — full matrix"
          fi
          # The PR head is whichever parent is not the queue base.
          if [ "$P1" = "$BASE_SHA" ]; then PR_HEAD="$P2"
          elif [ "$P2" = "$BASE_SHA" ]; then PR_HEAD="$P1"
          else emit false "neither parent is the queue base ($BASE_SHA) — full matrix"; fi

          # Fast-forward IFF the merge added nothing: the queue commit's tree equals the PR
          # head's tree. develop is append-only (protected, no force-push), so an identical
          # tree proves the base at PR-run time was also an ancestor of the PR head — i.e.
          # the PR run's own test-merge was this exact tree.
          MERGE_TREE=$(git rev-parse "HEAD^{tree}") || emit false "cannot read merge tree — full matrix"
          PR_TREE=$(git rev-parse "${PR_HEAD}^{tree}" 2>/dev/null) \
            || emit false "PR head tree not present — full matrix"
          if [ "$MERGE_TREE" != "$PR_TREE" ]; then
            emit false "develop moved since the PR was cut (real merge) — full matrix"
          fi

          # The PR run for this exact PR head must have gone fully green INCLUDING Quality,
          # so a dependabot PR (whose Quality is skipped, see the quality job) still gets a
          # real queue run rather than riding a half-validated PR run.
          # Addressed by path rather than by name: see the note in queue-validated. Filtering on
          # .name matched nothing here too, so this gate answered "full matrix" for every queue
          # entry and the suites the pull request had just passed ran again on the same tree.
          PR_RUN=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$PR_HEAD&event=pull_request&per_page=30" \
            --jq '[.workflow_runs[] | select(.status == "completed")]
                  | sort_by(.run_started_at) | last | .id // ""' 2>/dev/null) \
            || emit false "could not query the PR run — full matrix"
          if [ -z "$PR_RUN" ]; then emit false "no completed PR run for $PR_HEAD — full matrix"; fi
          CONCL=$(gh api "repos/$REPO/actions/runs/$PR_RUN" --jq '.conclusion // ""' 2>/dev/null || echo "")
          if [ "$CONCL" != "success" ]; then
            emit false "PR run $PR_RUN for $PR_HEAD is '$CONCL', not success — full matrix"
          fi
          QUALITY_OK=$(gh api "repos/$REPO/actions/runs/$PR_RUN/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | test("Quality")) | select(.conclusion == "success")] | length' \
            2>/dev/null || echo 0)
          if [ "${QUALITY_OK:-0}" -lt 1 ]; then
            emit false "PR run $PR_RUN did not run Quality to green (dependabot? re-run?) — full matrix"
          fi
          emit true "PR run $PR_RUN validated this exact tree ($MERGE_TREE) — skipping the redundant queue matrix"

  # On pushes (and dispatch) the real version must be stamped into assemblies before
  # anything ships, so build waits for GitVersion. On PRs nothing ships — build starts
  # immediately with a placeholder while pr-version computes the real number in
  # parallel, purely for the PR comment.
  # Queue runs are excluded alongside PRs: nothing ships from either, and GitVersion derives
  # its prerelease label from the branch name — for a queue ref that is
  # gh-readonly-queue/develop/pr-544-<40 hex>, yielding an 85-character version. Package file
  # names built from it trip NU5123 (path too long), which is warning-as-error here, so pack
  # fails on every queue run. Both events fall through to the placeholder below instead.
  version:
    name: Version
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-version.yml

  pr-version:
    name: PR Version
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-version.yml

  format:
    name: Verify Code Formatting
    # Gated on the two checks that mean "another run already covered this exact tree" — the
    # fast-forward check and the release-PR check — and never on queue-validated: a queue run ships
    # nothing, so skipping there costs nothing, while the publish jobs on a develop push need this
    # job's own success and a skipped one is not a success. Both gates are inert on a push, which
    # is the event those publish jobs run on, so neither can strand a release.
    needs: [ff-validated, release-pr]
    if: >-
      ${{ !failure() && !cancelled() && needs.ff-validated.outputs.skip != 'true' &&
      needs.release-pr.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-retry
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      # Whitespace and style only. The analyzers pass would run the third-party analyzers too, and
      # this job has not built the tree: the source generators that ship as project references
      # are not on disk yet, so the semantic model is incomplete and those analyzers report
      # findings that do not exist in a real build. The build job enforces them, with warnings
      # as errors, in every project.
      - name: Verify Code Formatting
        run: |
          dotnet format whitespace --verify-no-changes --no-restore
          dotnet format style --verify-no-changes --no-restore

      # Fails on NEW unqualified service-schema table refs inside migration function bodies
      # (the multi-schema search_path bug class). Existing debt is baselined; see
      # scripts/Lint-MigrationSql.ps1 and contributors/data-engines/writing-migrations.md rule 3.
      - name: Lint SQL migrations (schema qualification)
        shell: pwsh
        run: ./scripts/Lint-MigrationSql.ps1

  build:
    name: Build
    needs: [version, changes, release-pr]
    # !failure() && !cancelled(): version is skipped (not failed) on PRs — build must
    # still run there with the placeholder version below. Pushes honor the change filter
    # too: a docs-only merge runs no build/tests and publishes no package.
    #
    # NOT gated on the fast-forward check, though every suite and the quality gate are. The
    # queue run's build writes the determinism manifest, and the DEVELOP PUSH reads it back:
    # verify-rebuild downloads it from the queue run to prove the SDK and the assembly set,
    # which is the whole safety argument for publishing queue-validated bits unre-tested.
    # Skipping this on a fast-forward leaves no manifest to download, so verify-rebuild fails
    # and the prerelease publish it gates never happens. Build runs on the queue.
    #
    # The release-PR clause is the one skip that is safe here despite the manifest argument above:
    # it fires only when a PUSH run for this same commit is already building, and that run is the
    # one every consumer of the manifest reads.
    if: >-
      ${{ !failure() && !cancelled() && needs.release-pr.outputs.skip != 'true' &&
      (needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build.yml
    with:
      version: ${{ needs.version.outputs.semver || (github.event_name == 'merge_group' && format('0.0.0-queue.{0}', github.run_number) || format('0.0.0-pr{0}.{1}', github.event.pull_request.number, github.run_number)) }}

  # NOTE on the suites' `if`: a SKIPPED ancestor anywhere in the needs chain (version is
  # skipped on PRs) poisons the default success() status check transitively — without an
  # explicit if, every suite is skipped even though build succeeded.
  #
  # queue-validated skip: on develop pushes whose exact SHA already passed the full
  # merge-queue matrix, every suite (and quality) skips — see the queue-validated
  # section below for the verification that replaces them on the publish path.
  unit-tests:
    name: Unit Tests
    needs: [build, queue-validated, ff-validated, release-pr]
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' && needs.queue-validated.outputs.validated != 'true' && needs.ff-validated.outputs.skip != 'true' && needs.release-pr.outputs.skip != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-unit.yml
    with:
      # Use pre-built artifacts with in-job instrumentation for coverage
      artifact-name: build-${{ github.run_id }}

  postgres-integration:
    name: PostgreSQL Integration
    needs: [build, queue-validated, ff-validated, release-pr]
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' && needs.queue-validated.outputs.validated != 'true' && needs.ff-validated.outputs.skip != 'true' && needs.release-pr.outputs.skip != 'true' }}
    permissions:
      contents: read
    # The three Postgres-tagged projects run sequentially inside one job (shared containers),
    # and EFCore alone is ~87% of it — so EFCore is sliced four ways by shard category while
    # Dapper and Soak ride their own runners. Every tagged project appears in exactly one shard;
    # ShardCoverageGuardTests fails the build if a class carries no shard category, which would
    # otherwise mean it silently runs in no shard at all.
    # Whizbang.Soak.Tests is Postgres-tagged but is NOT an integration-mode project, so it has
    # never run in this job and gets no shard — a shard for it would run zero tests, emit no
    # coverage artifact, and hang the quality gate waiting for a file that never arrives.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: efcore-1
            projectFilter: 'EFCore\.Postgres'
            testFilter: '[Category=Shard1]'
          - shard: efcore-2
            projectFilter: 'EFCore\.Postgres'
            testFilter: '[Category=Shard2]'
          - shard: efcore-3
            projectFilter: 'EFCore\.Postgres'
            testFilter: '[Category=Shard3]'
          - shard: efcore-4
            projectFilter: 'EFCore\.Postgres'
            testFilter: '[Category=Shard4]'
          - shard: dapper
            projectFilter: 'Dapper\.Postgres'
            testFilter: ''
    uses: ./.github/workflows/reusable-test-postgres.yml
    with:
      artifact-name: build-${{ github.run_id }}
      project-filter: ${{ matrix.projectFilter }}
      test-filter: ${{ matrix.testFilter }}
      shard-name: ${{ matrix.shard }}

  inmemory-integration:
    name: InMemory Integration
    needs: [build, queue-validated, ff-validated, release-pr]
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' && needs.queue-validated.outputs.validated != 'true' && needs.ff-validated.outputs.skip != 'true' && needs.release-pr.outputs.skip != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-inmemory.yml
    with:
      artifact-name: build-${{ github.run_id }}

  rabbitmq-integration:
    name: RabbitMQ Integration
    needs: [build, queue-validated, ff-validated, release-pr]
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' && needs.queue-validated.outputs.validated != 'true' && needs.ff-validated.outputs.skip != 'true' && needs.release-pr.outputs.skip != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-rabbitmq.yml
    with:
      artifact-name: build-${{ github.run_id }}

  servicebus-integration:
    # Single-dimension matrix so GitHub renders the leg names itself ("Service Bus
    # Integration (whizbang)") — matrix expressions in `name:` don't render on
    # reusable-workflow-call jobs.
    name: Service Bus Integration
    needs: [build, queue-validated, ff-validated, release-pr]
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' && needs.queue-validated.outputs.validated != 'true' && needs.ff-validated.outputs.skip != 'true' && needs.release-pr.outputs.skip != 'true' }}
    permissions:
      contents: read
    # The two AzureServiceBus-tagged projects run sequentially inside one job (shared
    # containers), so one project per runner halves the suite's wall-clock.
    strategy:
      fail-fast: false
      matrix:
        shard: [whizbang, ecommerce]
    uses: ./.github/workflows/reusable-test-servicebus.yml
    with:
      artifact-name: build-${{ github.run_id }}
      project-filter: ${{ matrix.shard == 'whizbang' && 'Whizbang\.Transports\.AzureServiceBus' || 'ECommerce\.AzureServiceBus' }}
      shard-name: ${{ matrix.shard }}

  azureblob-integration:
    name: AzureBlob Integration
    needs: [build, queue-validated, ff-validated, release-pr]
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' && needs.queue-validated.outputs.validated != 'true' && needs.ff-validated.outputs.skip != 'true' && needs.release-pr.outputs.skip != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-azureblob.yml
    with:
      artifact-name: build-${{ github.run_id }}

  quality:
    name: Quality
    # Deliberately does NOT need the test suites: it starts its Sonar-wrapped build
    # while they run, then waits for their coverage artifacts internally (failing fast
    # if any test job fails). actions:read is required for that polling.
    #
    # Dependabot PR runs are excluded: workflows triggered by dependabot receive only
    # Dependabot-scope secrets (this repo defines none), so SONAR_TOKEN arrives empty
    # and the scanner hard-fails on auth — and a re-run keeps the original actor's
    # restricted context, so it can never recover. Skipping is safe because ci-result
    # accepts skipped jobs, and the merge queue re-runs quality with full secrets
    # before anything lands on develop.
    needs: [changes, queue-validated, ff-validated]
    # !failure() && !cancelled() is REQUIRED here: queue-validated and ff-validated are each
    # skipped on every event but their own (push / merge_group), and a skipped need would
    # otherwise poison the implicit success() check and silently skip quality everywhere. The
    # queue-validated clause skips quality on a queue-validated develop push; the ff-validated
    # clause skips it on a fast-forward queue run (the PR run's Sonar already covered this exact
    # tree). Coverage still reaches Codecov — via reupload-reports on the push, or the PR run's
    # own upload on a fast-forward.
    #
    # NOT gated on the release-PR check, though format, build and the six suites are. Those are
    # equivalent across the two runs covering a release cut: same commit, same bytes, same tests.
    # This job is NOT, because it behaves differently per EVENT — SonarScanner Begin/End run only
    # on a pull request or on main, so the push run for a release branch deliberately skips the
    # scanner. Yielding here removed the only context that ever analyzes a release PR, and the
    # release then merged to main carrying no analysis of its own.
    if: >-
      !failure() && !cancelled() &&
      (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') &&
      needs.queue-validated.outputs.validated != 'true' &&
      needs.ff-validated.outputs.skip != 'true' &&
      (needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group')
    permissions:
      contents: read
      actions: read
      pull-requests: write   # the uncovered-new-lines gate comments the list on the PR
    uses: ./.github/workflows/reusable-quality.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # Codecov Test Analytics - per-test results for failed-test reporting on PRs
  # and flake detection (https://app.codecov.io/gh/whizbang-lib/whizbang/tests)
  # ============================================================================

  test-results:
    name: Upload Test Results to Codecov
    # Failed-test reporting is the point, so this runs when suites FAIL too; only
    # cancellation or a skipped matrix (docs-only run) skips it. The suites all share
    # one gate (build success), so unit-tests stands proxy for the whole matrix.
    #
    # The check is a DIRECT needs.<job>.result read, NOT contains(needs.*.result, ...):
    # in a job-level `if`, the needs.* object filter proved to see the results of skipped
    # TRANSITIVE ancestors (version is skipped on PR runs), so a 'skipped'-scan silently
    # skipped this job even with all six direct needs green — the same transitive
    # poisoning documented on the suites' `if`, which direct result reads dodge.
    #
    # Codecov accepts JUnit XML only, and the suites emit TRX (Microsoft.Testing.Platform
    # --report-trx), so the trx-* artifacts are converted here with trx2junit. Downloaded
    # WITHOUT merge-multiple: the four EFCore shards run the same projects under different
    # category filters, so their TRX files share paths and merging would keep only one.
    #
    # Deliberately NOT in ci-result's needs: like publish-test-status this is
    # observability, and a Codecov outage must not block a merge. The upload step
    # defaults to fail_ci_if_error: false for the same reason.
    # On queue-validated develop pushes the suites skip, but reupload-reports republishes
    # the queue run's TRX into this run (as trx-queue) — so the upload still happens,
    # under the develop branch context Codecov's flake baseline needs.
    needs: [unit-tests, postgres-integration, inmemory-integration, rabbitmq-integration, servicebus-integration, azureblob-integration, reupload-reports]
    if: ${{ !cancelled() && (needs.unit-tests.result != 'skipped' || needs.reupload-reports.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-retry
        with:
          dotnet-version: '10.0.x'

      - name: Download TRX artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: trx-*
          path: trx

      - name: Convert TRX to JUnit XML
        id: junit
        run: |
          dotnet tool install --global trx2junit --version 2.1.0
          # trx2junit targets an older runtime than the pinned 10.0.x SDK — roll forward.
          export DOTNET_ROLL_FORWARD=LatestMajor
          mapfile -t TRX < <(find trx -name '*.trx' 2>/dev/null)
          if [ "${#TRX[@]}" -eq 0 ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No TRX files found (suites died before producing results?) — nothing to upload"
            exit 0
          fi
          CONVERTED=0
          for f in "${TRX[@]}"; do
            if trx2junit "$f"; then
              # Codecov's auto-search only matches *junit*/*test* XML names; converted
              # in place (next to each TRX) so same-named shard files cannot collide.
              mv "${f%.trx}.xml" "${f%.trx}.junit.xml"
              CONVERTED=$((CONVERTED + 1))
            else
              echo "::warning::trx2junit failed on $f — skipping this file"
            fi
          done
          if [ "$CONVERTED" -eq 0 ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No TRX file survived conversion — nothing to upload"
            exit 0
          fi
          echo "have=true" >> "$GITHUB_OUTPUT"
          echo "Converted $CONVERTED of ${#TRX[@]} TRX file(s) to JUnit XML"

      # codecov/test-results-action is deprecated (and was the last node20 action here):
      # codecov-action itself does test results with report_type: test_results, driving the
      # same Codecov CLI. Inputs are otherwise identical to the action it replaces, so the
      # search still walks trx/ and picks up the *.junit.xml the convert step wrote there.
      - name: Upload test results to Codecov
        if: steps.junit.outputs.have == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          directory: trx
          fail_ci_if_error: false

  # ============================================================================
  # CI Result - the ONE ruleset-required status check
  # ============================================================================

  ci-result:
    name: CI Result
    # Sole required context in the develop ruleset. Skipped jobs are fine — docs-only
    # PRs/pushes skip the matrix by design, and version/pr-version are event-exclusive —
    # but any failure or cancellation fails the gate. Requiring only this context also
    # means test jobs can be renamed/sharded without touching the ruleset.
    # queue-validated / verify-rebuild / reupload-reports are push-only (skipped
    # elsewhere, which this gate tolerates); listing them means a failed rebuild
    # verification or report republish turns the develop push run red here too.
    needs: [changes, version, pr-version, format, build, unit-tests, postgres-integration, inmemory-integration, rabbitmq-integration, servicebus-integration, azureblob-integration, quality, pack, queue-validated, verify-rebuild, reupload-reports, ff-validated]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Evaluate required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e '[.[] | select(.result == "failure" or .result == "cancelled")] | length > 0' > /dev/null; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All jobs succeeded or were legitimately skipped."

  # ============================================================================
  # Pack NuGet Packages - validates packability and produces artifacts
  # ============================================================================

  pack:
    name: Pack NuGet Packages
    needs: [version, build]
    # version is skipped (not failed) on PRs; pack still validates packability there.
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-retry
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ github.run_id }}

      - name: Pack NuGet packages (no rebuild)
        env:
          VERSION: ${{ needs.version.outputs.semver || (github.event_name == 'merge_group' && format('0.0.0-queue.{0}', github.run_number) || format('0.0.0-pr{0}.{1}', github.event.pull_request.number, github.run_number)) }}
        run: |
          # NU5017 false positive for analyzer packages in .NET 10 SDK
          dotnet pack --configuration Release --no-build --output ./packages /p:Version="$VERSION" || true

      - name: Verify expected packages
        run: |
          # NOTE: Internal packages excluded (IsPackable=false):
          #   - Whizbang.Generators.Shared (ILMerged into generator packages)
          #   - Whizbang.Testing (empty placeholder)
          EXPECTED_PACKAGES=(
            "SoftwareExtravaganza.Whizbang.Core"
            "SoftwareExtravaganza.Whizbang.Generators"
            "SoftwareExtravaganza.Whizbang.Data.Postgres"
            "SoftwareExtravaganza.Whizbang.Data.Schema"
            "SoftwareExtravaganza.Whizbang.Data.Dapper.Custom"
            "SoftwareExtravaganza.Whizbang.Data.Dapper.Postgres"
            "SoftwareExtravaganza.Whizbang.Data.Dapper.Sqlite"
            "SoftwareExtravaganza.Whizbang.Data.EFCore.Custom"
            "SoftwareExtravaganza.Whizbang.Data.EFCore.Postgres"
            "SoftwareExtravaganza.Whizbang.Data.EFCore.Postgres.Generators"
            "SoftwareExtravaganza.Whizbang.Observability"
            "SoftwareExtravaganza.Whizbang.Sagas.Contracts"
            "SoftwareExtravaganza.Whizbang.Sagas"
            "SoftwareExtravaganza.Whizbang.Sagas.Generators"
            "SoftwareExtravaganza.Whizbang.SignalR"
            "SoftwareExtravaganza.Whizbang.Transports.AzureServiceBus"
            "SoftwareExtravaganza.Whizbang.Transports.RabbitMQ"
            "SoftwareExtravaganza.Whizbang.Transports.Mutations"
            "SoftwareExtravaganza.Whizbang.Transports.FastEndpoints"
            "SoftwareExtravaganza.Whizbang.Transports.FastEndpoints.Generators"
            "SoftwareExtravaganza.Whizbang.Transports.HotChocolate"
            "SoftwareExtravaganza.Whizbang.Transports.HotChocolate.Generators"
            "SoftwareExtravaganza.Whizbang.Hosting.AspNet"
            "SoftwareExtravaganza.Whizbang.Hosting.Azure.ServiceBus"
            "SoftwareExtravaganza.Whizbang.Hosting.RabbitMQ"
            "SoftwareExtravaganza.Whizbang.Migrate"
            "SoftwareExtravaganza.Whizbang.CLI"
          )

          MISSING=0
          for pkg in "${EXPECTED_PACKAGES[@]}"; do
            # compgen -G: glob-match test — [ -f glob ] breaks when a glob matches more than one file
            if ! compgen -G "./packages/${pkg}.*.nupkg" > /dev/null; then
              echo "ERROR: ${pkg} package not created"
              MISSING=$((MISSING + 1))
            else
              echo "✓ ${pkg}"
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo ""
            echo "ERROR: ${MISSING} package(s) missing"
            exit 1
          fi

          echo ""
          echo "All ${#EXPECTED_PACKAGES[@]} packages verified successfully"

      - name: List packages
        run: ls -la ./packages

      - name: Upload NuGet packages
        # On PRs and queue runs pack is a packability gate only — nothing consumes the
        # artifact, because the publish jobs are gated on push.
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nuget-packages-${{ github.run_id }}
          path: ./packages/*.nupkg
          retention-days: 3

  version-comment:
    name: Comment Version on PR
    needs: pr-version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create or Update Version Comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SEMVER: ${{ needs.pr-version.outputs.semver }}
          FULLSEMVER: ${{ needs.pr-version.outputs.fullsemver }}
          PRERELEASE: ${{ needs.pr-version.outputs.prerelease || 'none' }}
        run: |
          BODY="📦 **Version Information**: \`$SEMVER\`

          | Property | Value |
          |----------|-------|
          | SemVer | \`$SEMVER\` |
          | Full SemVer | \`$FULLSEMVER\` |
          | Pre-release | \`$PRERELEASE\` |"

          # Find existing version comment
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[] | select(.body | startswith("📦")) | .id' | head -1)

          if [ -n "$COMMENT_ID" ]; then
            echo "Updating existing comment: $COMMENT_ID"
            gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            echo "Creating new version comment"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY"
          fi

  # ============================================================================
  # Prerelease NuGet Publish - Auto-publish on develop push
  # Gated on validation of the exact bits: either every suite passed IN THIS RUN,
  # or the merge queue already ran the full matrix on this exact SHA and
  # verify-rebuild proved the freshly-versioned rebuild matches the queue-tested
  # outputs (same SDK; hash-identical outside the documented upstream-
  # nondeterminism allowlist). See the queue-validated section above and
  # docs/RELEASING.md.
  # ============================================================================

  prerelease-publish:
    name: Publish Prerelease NuGet
    needs: [version, pack, format, unit-tests, postgres-integration, inmemory-integration, rabbitmq-integration, servicebus-integration, azureblob-integration, queue-validated, verify-rebuild]
    # The explicit per-suite results replace the old implicit success() (which a
    # skipped suite would poison). Publish requires pack + format green AND either
    # the full same-run matrix or the queue-validated + verified-rebuild pair.
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      needs.pack.result == 'success' && needs.format.result == 'success' &&
      ((needs.unit-tests.result == 'success' && needs.postgres-integration.result == 'success' &&
        needs.inmemory-integration.result == 'success' && needs.rabbitmq-integration.result == 'success' &&
        needs.servicebus-integration.result == 'success' && needs.azureblob-integration.result == 'success') ||
       (needs.queue-validated.outputs.validated == 'true' && needs.verify-rebuild.result == 'success'))
    permissions:
      contents: read
      id-token: write       # NuGet OIDC trusted publishing
      attestations: write   # nuget-push attests provenance before pushing
    uses: ./.github/workflows/nuget-push.yml
    with:
      version: ${{ needs.version.outputs.semver }}
      artifact-name: nuget-packages-${{ github.run_id }}
    secrets:
      PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
      PUSHOVER_USER_KEY_1: ${{ secrets.PUSHOVER_USER_KEY_1 }}
      PUSHOVER_USER_KEY_2: ${{ secrets.PUSHOVER_USER_KEY_2 }}
      PUSHOVER_USER_KEY_3: ${{ secrets.PUSHOVER_USER_KEY_3 }}
      PUSHOVER_USER_KEY_4: ${{ secrets.PUSHOVER_USER_KEY_4 }}
      PUSHOVER_USER_KEY_5: ${{ secrets.PUSHOVER_USER_KEY_5 }}
      PUSHOVER_USER_KEY_6: ${{ secrets.PUSHOVER_USER_KEY_6 }}
      PUSHOVER_USER_KEY_7: ${{ secrets.PUSHOVER_USER_KEY_7 }}
      PUSHOVER_USER_KEY_8: ${{ secrets.PUSHOVER_USER_KEY_8 }}
      PUSHOVER_USER_KEY_9: ${{ secrets.PUSHOVER_USER_KEY_9 }}
      PUSHOVER_USER_KEY_10: ${{ secrets.PUSHOVER_USER_KEY_10 }}

  # ============================================================================
  # Release NuGet Publish - Auto-publish on release/v* push (e.g. hotfix merge)
  # Same gating as develop; the VERSION comes from the branch name
  # (release/v0.290.3-alpha.1 -> 0.290.3-alpha.1) via reusable-version's
  # release-line override, NOT GitVersion. Delegates to nuget-publish.yml with
  # this run's tested pack artifact, so the pushed packages are the exact bits
  # that passed the matrix — plus the git tag + GitHub release.
  # The branch-creation push is skipped (the base cut has no changes yet).
  # GUARD: a release branch with an OPEN PR into main publishes on MERGE (release.yml). The
  # release-guard job below skips this push-publish in that case, so a push to the release branch
  # (a conflict fix, a stabilization commit) never competes with the merge for the approval gate
  # or attempts a duplicate version+tag.
  # With NO open PR, the guard classifies the branch by LINE (docs/RELEASING.md → "Hotfixes"):
  #   current line (version above the highest stable tag) — must reach main AND develop, so the
  #     guard opens the release PR into main instead of publishing here; the merge then publishes
  #     through release.yml and sync-develop brings it back, exactly like a release cut.
  #   older line (version at or below the highest stable tag) — must NOT reach main (it would
  #     regress main to an older release), so it publishes here and release-sync-develop opens a
  #     develop-only back-merge PR. Without that PR the fix would exist only on its own branch and
  #     the next cut from develop would silently ship without it.
  # ============================================================================

  release-guard:
    name: Release Publish Guard
    needs: [version]
    # Not on the branch-creation push: that is the base cut with no changes yet, and start-release
    # opens its own PR seconds after pushing — a guard-opened PR could win that race and break it.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v') && !github.event.created
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      line: ${{ steps.check.outputs.line }}
    steps:
      - name: Classify the release branch and route its publish
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # RELEASE_PAT opens the PR so its CI runs (a GITHUB_TOKEN-created PR sits in
          # action_required and never reports its required checks).
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.semver }}
        run: |
          # If this release branch has an OPEN PR into main, the canonical publish happens on
          # merge (release.yml); publishing here too would compete for the nuget-publish approval
          # gate and attempt a duplicate version+tag.
          open_pr() { gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // ""'; }
          PR=$(open_pr)
          if [ -n "$PR" ]; then
            echo "Open release PR to main (#$PR) — the merge will publish. Skipping release-branch publish."
            { echo "should_publish=false"; echo "line=current"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Highest STABLE tag in the repo. A prerelease never counts: a line is only "older" once
          # something above it has actually shipped stable.
          # Captured separately so a failed lookup aborts (-e) instead of reading as "no tags".
          TAG_REFS=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/v" --jq '.[].ref')
          HIGHEST=$(sed -n 's#^refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p' <<< "$TAG_REFS" | sort -V | tail -1)
          if [ -z "$HIGHEST" ]; then
            echo "::error::No stable vX.Y.Z tag found — cannot tell a current-line hotfix from an older-line patch."
            exit 1
          fi
          CORE="${VERSION%%-*}"
          if [ "$(printf '%s\n%s\n' "$HIGHEST" "$CORE" | sort -V | tail -1)" = "$HIGHEST" ]; then
            LINE=older      # at or below something already shipped stable
          else
            LINE=current
          fi
          echo "Version $VERSION vs highest stable v${HIGHEST} → $LINE line"
          echo "line=$LINE" >> "$GITHUB_OUTPUT"

          if [ "$LINE" = "current" ]; then
            # Route through main like every release: the merge publishes (release.yml) and
            # sync-develop carries it back. The title IS the version string (release.yml parses it).
            GH_TOKEN="$RELEASE_PAT" gh pr create --repo "$REPO" --head "$BRANCH" --base main \
              --title "chore(release): v${VERSION}" \
              --body "Current-line hotfix: v${VERSION} is above the highest stable release (v${HIGHEST}), so it ships through main — merging publishes it and syncs develop. Opened automatically because the branch was pushed without a PR." \
              || [ -n "$(open_pr)" ] || {
              echo "::error::Could not open the release PR into main for $BRANCH. Open it by hand with title 'chore(release): v${VERSION}'."
              exit 1
            }
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "### Current-line hotfix → release PR into main opened; the merge publishes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No open release PR to main and an older line — publishing from the release-branch push; develop gets a back-merge PR."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  release-publish:
    name: Publish Release NuGet
    needs: [version, pack, format, unit-tests, postgres-integration, inmemory-integration, rabbitmq-integration, servicebus-integration, azureblob-integration, release-guard]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v') && !github.event.created && needs.release-guard.outputs.should_publish == 'true'
    permissions:
      contents: write       # nuget-publish creates the tag + GitHub release
      id-token: write       # NuGet OIDC trusted publishing
      attestations: write   # nuget-push attests provenance before pushing
    uses: ./.github/workflows/nuget-publish.yml
    with:
      version: ${{ needs.version.outputs.semver }}
      ref: ${{ github.sha }}
      artifact-name: nuget-packages-${{ github.run_id }}
    secrets: inherit

  # An older-line patch never reaches main, but develop must still get the fix or the next cut from
  # develop ships without it. Same mechanism release.yml uses after a main merge.
  release-sync-develop:
    name: Sync Hotfix to Develop
    needs: [version, release-guard, release-publish]
    if: needs.release-publish.result == 'success' && needs.release-guard.outputs.line == 'older'
    permissions:
      contents: write        # push the throwaway sync branch (sync/*, not protected)
      pull-requests: write    # open the review PR into protected develop
    uses: ./.github/workflows/reusable-sync-develop.yml
    with:
      source-ref: ${{ github.sha }}
      source-label: hotfix
      version: ${{ needs.version.outputs.semver }}
    secrets:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}

  # ============================================================================
  # Notifications - Send push notifications on build completion
  # ============================================================================

  notify-success:
    name: Notify Success
    needs: [changes, quality]
    permissions:
      contents: read
    # merge_group is excluded because the queue's own run is not a merge. Its ref is
    # refs/heads/gh-readonly-queue/<base>/pr-N-<sha>, which matches neither exclusion below, so this
    # fired when a PR ENTERED the queue and its prospective-merge CI passed. That sounded exactly like
    # a merge and arrived minutes before one, and the PR could still be dequeued afterwards.
    # The actual merge is announced by notify-pr-merged.yml, on pull_request closed with merged true,
    # which the queue sets only once the commit is really on the branch.
    if: |
      always() &&
      github.event_name != 'merge_group' &&
      github.ref != 'refs/heads/develop' &&
      !startsWith(github.ref, 'refs/heads/release/v') &&
      (needs.quality.result == 'success' || (needs.changes.outputs.code != 'true' && github.event_name == 'pull_request')) &&
      vars.PUSHOVER_ENABLED == 'true'
    uses: ./.github/workflows/notify-build-status.yml
    with:
      status: success
    secrets:
      PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
      PUSHOVER_USER_KEY_1: ${{ secrets.PUSHOVER_USER_KEY_1 }}
      PUSHOVER_USER_KEY_2: ${{ secrets.PUSHOVER_USER_KEY_2 }}
      PUSHOVER_USER_KEY_3: ${{ secrets.PUSHOVER_USER_KEY_3 }}
      PUSHOVER_USER_KEY_4: ${{ secrets.PUSHOVER_USER_KEY_4 }}
      PUSHOVER_USER_KEY_5: ${{ secrets.PUSHOVER_USER_KEY_5 }}
      PUSHOVER_USER_KEY_6: ${{ secrets.PUSHOVER_USER_KEY_6 }}
      PUSHOVER_USER_KEY_7: ${{ secrets.PUSHOVER_USER_KEY_7 }}
      PUSHOVER_USER_KEY_8: ${{ secrets.PUSHOVER_USER_KEY_8 }}
      PUSHOVER_USER_KEY_9: ${{ secrets.PUSHOVER_USER_KEY_9 }}
      PUSHOVER_USER_KEY_10: ${{ secrets.PUSHOVER_USER_KEY_10 }}

  notify-failure:
    name: Notify Failure
    # Depends on the aggregate gate rather than a list of jobs, so a failure is announced wherever it
    # happens: a pull request run and the merge queue's run alike.
    #
    # Enumerating jobs was the bug. The queue's run takes the fast-forward path, where the heavy jobs
    # are SKIPPED and ff-validated does the work; a skipped need does not make failure() true, and
    # ff-validated was not in the list, so a queue failure notified nothing at all. The queue gates
    # were added after this list was written, which is how the two drifted apart.
    #
    # ci-result runs with always() and already needs every gate including queue-validated,
    # verify-rebuild and ff-validated, so asking it one question cannot drift as jobs are added.
    needs: [ci-result]
    permissions:
      contents: read
    # merge_group is deliberately NOT excluded. A failure on the queue's run dequeues the pull
    # request, and nothing else tells you the merge you were waiting on is not going to happen.
    if: needs.ci-result.result == 'failure' && github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/heads/release/v') && vars.PUSHOVER_ENABLED == 'true'
    uses: ./.github/workflows/notify-build-status.yml
    with:
      status: failure
    secrets:
      PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
      PUSHOVER_USER_KEY_1: ${{ secrets.PUSHOVER_USER_KEY_1 }}
      PUSHOVER_USER_KEY_2: ${{ secrets.PUSHOVER_USER_KEY_2 }}
      PUSHOVER_USER_KEY_3: ${{ secrets.PUSHOVER_USER_KEY_3 }}
      PUSHOVER_USER_KEY_4: ${{ secrets.PUSHOVER_USER_KEY_4 }}
      PUSHOVER_USER_KEY_5: ${{ secrets.PUSHOVER_USER_KEY_5 }}
      PUSHOVER_USER_KEY_6: ${{ secrets.PUSHOVER_USER_KEY_6 }}
      PUSHOVER_USER_KEY_7: ${{ secrets.PUSHOVER_USER_KEY_7 }}
      PUSHOVER_USER_KEY_8: ${{ secrets.PUSHOVER_USER_KEY_8 }}
      PUSHOVER_USER_KEY_9: ${{ secrets.PUSHOVER_USER_KEY_9 }}
      PUSHOVER_USER_KEY_10: ${{ secrets.PUSHOVER_USER_KEY_10 }}

  notify-cancelled:
    name: Notify Cancelled
    needs: [build, format, unit-tests, postgres-integration, inmemory-integration, rabbitmq-integration, servicebus-integration, azureblob-integration, quality]
    permissions:
      contents: read
    # merge_group is excluded for a different reason than success: the queue cancels its own runs
    # whenever it reshuffles the batch, so this was noise rather than a wrong-time notification.
    if: cancelled() && github.event_name != 'merge_group' && github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/heads/release/v') && vars.PUSHOVER_ENABLED == 'true'
    uses: ./.github/workflows/notify-build-status.yml
    with:
      status: cancelled
    secrets:
      PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
      PUSHOVER_USER_KEY_1: ${{ secrets.PUSHOVER_USER_KEY_1 }}
      PUSHOVER_USER_KEY_2: ${{ secrets.PUSHOVER_USER_KEY_2 }}
      PUSHOVER_USER_KEY_3: ${{ secrets.PUSHOVER_USER_KEY_3 }}
      PUSHOVER_USER_KEY_4: ${{ secrets.PUSHOVER_USER_KEY_4 }}
      PUSHOVER_USER_KEY_5: ${{ secrets.PUSHOVER_USER_KEY_5 }}
      PUSHOVER_USER_KEY_6: ${{ secrets.PUSHOVER_USER_KEY_6 }}
      PUSHOVER_USER_KEY_7: ${{ secrets.PUSHOVER_USER_KEY_7 }}
      PUSHOVER_USER_KEY_8: ${{ secrets.PUSHOVER_USER_KEY_8 }}
      PUSHOVER_USER_KEY_9: ${{ secrets.PUSHOVER_USER_KEY_9 }}
      PUSHOVER_USER_KEY_10: ${{ secrets.PUSHOVER_USER_KEY_10 }}

  # ============================================================================
  # Living docs: publish test status to the docs site
  # ============================================================================

  publish-test-status:
    name: Publish Test Status to Docs
    # Ships per-test pass/fail to whizbang-lib.github.io so doc pages render
    # live verification badges. Runs even when suites FAIL (failures are what
    # the badges must show) but not when cancelled. No-ops without the token
    # or when suites were skipped (docs-only pushes produce no TRX).
    # reupload-reports is in needs purely for ordering: on queue-validated pushes it
    # republishes the queue run's TRX as trx-queue before this job downloads trx-*.
    needs: [version, unit-tests, postgres-integration, inmemory-integration, rabbitmq-integration, servicebus-integration, azureblob-integration, reupload-reports]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCS_TOKEN: ${{ secrets.DOCS_REPO_PUSH_TOKEN }}
    steps:
      - name: Check for docs push token
        id: token
        run: |
          if [ -n "$DOCS_TOKEN" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "DOCS_REPO_PUSH_TOKEN not set — skipping test-status publish"
          fi

      - name: Download TRX artifacts
        if: steps.token.outputs.have == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: trx-*
          path: trx

      - name: Check TRX presence
        id: trx
        if: steps.token.outputs.have == 'true'
        run: |
          if [ -n "$(find trx -name '*.trx' 2>/dev/null | head -1)" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No TRX artifacts (suites skipped?) — nothing to publish"
          fi

      - name: Checkout docs repo
        if: steps.trx.outputs.have == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: whizbang-lib/whizbang-lib.github.io
          ref: main
          token: ${{ secrets.DOCS_REPO_PUSH_TOKEN }}
          path: docs-repo

      - name: Build test-status data
        if: steps.trx.outputs.have == 'true'
        run: |
          node docs-repo/src/scripts/build-test-status.mjs \
            --trx-dir trx \
            --out docs-repo/src/assets/data/test-status \
            --run-id "${{ github.run_id }}" \
            --sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --library-version "${{ needs.version.outputs.semver }}"

      # The docs main ruleset requires PRs (0 approvals, no required checks),
      # so publish = push branch + create PR + instant merge. Skips when the
      # status is byte-identical to what is already live.
      - name: Publish to docs main
        if: steps.trx.outputs.have == 'true'
        working-directory: docs-repo
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_PUSH_TOKEN }}
        run: |
          git config user.name "whizbang-ci"
          git config user.email "ci@whizba.ng"
          git add src/assets/data/test-status
          if git diff --cached --quiet; then
            echo "Test status unchanged — nothing to publish"
            exit 0
          fi
          BRANCH="test-status/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "chore(test-status): whizbang run ${{ github.run_id }} (${GITHUB_SHA:0:8})"
          # Force: a re-run shares the run_id, so a prior attempt that died between its
          # branch push and PR merge leaves this branch behind — overwrite, don't collide.
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(test-status): run ${{ github.run_id }}" \
            --body "Automated live test-status data from [whizbang CI run ${{ github.run_id }}](https://github.com/whizbang-lib/whizbang/actions/runs/${{ github.run_id }})." \
            || echo "PR for $BRANCH already exists (prior attempt) — merging it with the force-pushed content"
          for i in 1 2 3 4 5; do
            gh pr merge "$BRANCH" --squash --delete-branch && exit 0
            echo "merge attempt $i failed; retrying in 5s"
            sleep 5
          done
          echo "Could not merge test-status PR — leaving it open for manual merge"
