name: NuGet Push

on:
  workflow_call:
    inputs:
      version:
        description: 'Version being published'
        required: true
        type: string
      artifact-name:
        description: 'Name of the artifact containing .nupkg files'
        required: true
        type: string
    secrets:
      PUSHOVER_API_TOKEN:
        required: false
      PUSHOVER_USER_KEY_1:
        required: false
      PUSHOVER_USER_KEY_2:
        required: false
      PUSHOVER_USER_KEY_3:
        required: false
      PUSHOVER_USER_KEY_4:
        required: false
      PUSHOVER_USER_KEY_5:
        required: false
      PUSHOVER_USER_KEY_6:
        required: false
      PUSHOVER_USER_KEY_7:
        required: false
      PUSHOVER_USER_KEY_8:
        required: false
      PUSHOVER_USER_KEY_9:
        required: false
      PUSHOVER_USER_KEY_10:
        required: false

# Least-privilege: NO workflow-level grants (S8233/S8264) — every job declares exactly
# what it needs (the push job carries id-token: write for NuGet OIDC trusted publishing).
permissions: {}

jobs:
  push:
    name: Push to NuGet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Which environment this runs under decides whether a human has to approve it, because the
    # approval is a property of the environment and not of the job: there is no way to write "wait
    # for a reviewer, unless...". So the switch picks the environment instead.
    #
    # nuget-publish        - required reviewers. The default, and what an unset variable gives.
    # nuget-publish-auto   - no reviewers, so the push goes straight out.
    #
    # Set the repository variable PUBLISH_WITHOUT_APPROVAL to 'true' to take the second one for as
    # long as it stays set, and unset it to go back. A variable rather than a secret: the secrets
    # context is not available to job-level keys, and there is nothing sensitive about a boolean.
    #
    # Every push to nuget.org goes through this job -- ci.yml for develop prereleases,
    # nuget-publish.yml for explicit versions, release.yml for releases -- because nuget.org's
    # trusted-publishing policy names this workflow file and rejects a push from any other. So this
    # one switch is every nuget push, which is the point. release.yml's "Approve Release" job needs
    # nothing here: its release-approval environment carries no rules and already auto-passes.
    #
    # IMPORTANT, and the reason this cannot just be switched on: the publish authenticates with OIDC
    # trusted publishing, and the environment name is part of the token's claims. A nuget.org
    # trusted-publishing policy that names an environment will therefore reject the other one. Before
    # setting the variable, give nuget.org a policy for nuget-publish-auto as well (or one with no
    # environment named). Getting this wrong fails at the push, after the packages are built and
    # attested, not at the gate.
    environment: ${{ vars.PUBLISH_WITHOUT_APPROVAL == 'true' && 'nuget-publish-auto' || 'nuget-publish' }}
    permissions:
      id-token: write       # NuGet OIDC trusted publishing + Sigstore keyless signing
      attestations: write   # SLSA build provenance for the published packages
    outputs:
      version: ${{ inputs.version }}

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ./packages

      - name: List packages
        run: ls -la ./packages/*.nupkg

      # Provenance BEFORE push: what ships must already be attested. This binds each
      # .nupkg hash to this repo, workflow, commit, and run (SLSA, Sigstore-signed) —
      # verifiable by anyone with:
      #   gh attestation verify <pkg>.nupkg --owner whizbang-lib
      # A Sigstore outage therefore blocks the publish; never reorder this after the push, or a
      # package could reach nuget.org without provenance. This used to add "and the approval gate
      # means a human is already watching" -- that holds only while PUBLISH_WITHOUT_APPROVAL is unset, so
      # with it set an outage blocks an unattended publish and nobody is looking at it.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./packages/*.nupkg

      # The Sigstore bundle also travels as a run artifact so release-shaped callers
      # (nuget-publish.yml) can attach it to the GitHub Release for offline verification.
      - name: Upload attestation bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: attestation-bundle-${{ github.run_id }}
          path: ${{ steps.attest.outputs.bundle-path }}
          retention-days: 7

      - name: NuGet Login (OIDC Trusted Publishing)
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: phil.carbone

      - name: Push to NuGet (with retry)
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            if dotnet nuget push "./packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate; then
              echo "Published successfully on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          echo "All attempts failed"
          exit 1

      - name: Generate SHA256 Hashes
        run: |
          cd ./packages
          for file in *.nupkg; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
          # Said out loud in the summary, because a publish that skipped review should not look
          # identical to one that passed it when someone reads this later.
          REVIEWED: ${{ vars.PUBLISH_WITHOUT_APPROVAL == 'true' && 'no' || 'yes' }}
        run: |
          PACKAGE_COUNT=$(ls ./packages/*.nupkg 2>/dev/null | wc -l)
          echo "## Published v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$REVIEWED" = "no" ]; then
            echo "> Published WITHOUT review: PUBLISH_WITHOUT_APPROVAL is set, so this ran in the" \
                 "unprotected environment. Unset that variable to restore the approval gate." \
                 >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Version**: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Packages**: $PACKAGE_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- **NuGet**: https://www.nuget.org/packages/SoftwareExtravaganza.Whizbang.Core/$VERSION" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # Notifications
  # ============================================================================

  notify-deployed:
    name: Notify Deployed
    needs: [push]
    if: success() && vars.PUSHOVER_ENABLED == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/notify-pushover

      - name: Send Notification
        uses: ./.github/actions/notify-pushover
        with:
          api-token: ${{ secrets.PUSHOVER_API_TOKEN }}
          user-key-1: ${{ secrets.PUSHOVER_USER_KEY_1 }}
          user-key-2: ${{ secrets.PUSHOVER_USER_KEY_2 }}
          user-key-3: ${{ secrets.PUSHOVER_USER_KEY_3 }}
          user-key-4: ${{ secrets.PUSHOVER_USER_KEY_4 }}
          user-key-5: ${{ secrets.PUSHOVER_USER_KEY_5 }}
          user-key-6: ${{ secrets.PUSHOVER_USER_KEY_6 }}
          user-key-7: ${{ secrets.PUSHOVER_USER_KEY_7 }}
          user-key-8: ${{ secrets.PUSHOVER_USER_KEY_8 }}
          user-key-9: ${{ secrets.PUSHOVER_USER_KEY_9 }}
          user-key-10: ${{ secrets.PUSHOVER_USER_KEY_10 }}
          title: "[LIB] 🚀 Deployed v${{ needs.push.outputs.version }}"
          message: "Whizbang v${{ needs.push.outputs.version }} published to NuGet"
          status: deployed
          url: "https://www.nuget.org/packages/SoftwareExtravaganza.Whizbang.Core/${{ needs.push.outputs.version }}"
          url-title: "View on NuGet"

  notify-deploy-failed:
    name: Notify Deploy Failed
    needs: [push]
    if: failure() && vars.PUSHOVER_ENABLED == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/notify-pushover

      - name: Send Notification
        uses: ./.github/actions/notify-pushover
        with:
          api-token: ${{ secrets.PUSHOVER_API_TOKEN }}
          user-key-1: ${{ secrets.PUSHOVER_USER_KEY_1 }}
          user-key-2: ${{ secrets.PUSHOVER_USER_KEY_2 }}
          user-key-3: ${{ secrets.PUSHOVER_USER_KEY_3 }}
          user-key-4: ${{ secrets.PUSHOVER_USER_KEY_4 }}
          user-key-5: ${{ secrets.PUSHOVER_USER_KEY_5 }}
          user-key-6: ${{ secrets.PUSHOVER_USER_KEY_6 }}
          user-key-7: ${{ secrets.PUSHOVER_USER_KEY_7 }}
          user-key-8: ${{ secrets.PUSHOVER_USER_KEY_8 }}
          user-key-9: ${{ secrets.PUSHOVER_USER_KEY_9 }}
          user-key-10: ${{ secrets.PUSHOVER_USER_KEY_10 }}
          title: "[LIB] ❌ Deploy Failed"
          message: "Failed to publish Whizbang to NuGet"
          status: deploy-failed
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          url-title: "View Workflow"
