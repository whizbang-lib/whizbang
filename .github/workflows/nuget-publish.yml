name: NuGet Publish

# Canonical explicit-version publish pipeline: build + pack at the given version from the given
# ref, push THROUGH nuget-push.yml — the only workflow file trusted by nuget.org's Trusted
# Publishing policy (pushing from any other workflow fails OIDC token exchange with
# "Workflow mismatch for policy") — then create the git tag + GitHub release.
#
# Used by: manual workflow_dispatch, and ci.yml's release-publish job (release/v* branch
# pushes). When the caller already built, tested, and packed the bits (ci.yml), it passes
# artifact-name and the pack job here is skipped — the pushed packages are the exact bits
# that went through the test matrix.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.3.0-alpha.26)'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout (branch, tag, or SHA). Defaults to current ref.'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
      artifact-name:
        description: >-
          Name of an existing NuGet packages artifact uploaded earlier in the calling run.
          When set, the pack job is skipped and these packages are pushed/released as-is.
        required: false
        type: string
        default: ''
    secrets:
      # Optional and never passed: the jobs that use them read the release-app environment's own
      # secrets, which override anything a caller could pass (#1466). Declared so the linter knows them.
      RELEASE_APP_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
      PUSHOVER_API_TOKEN:
        required: false
      PUSHOVER_USER_KEY_1:
        required: false
      PUSHOVER_USER_KEY_2:
        required: false
      PUSHOVER_USER_KEY_3:
        required: false
      PUSHOVER_USER_KEY_4:
        required: false
      PUSHOVER_USER_KEY_5:
        required: false
      PUSHOVER_USER_KEY_6:
        required: false
      PUSHOVER_USER_KEY_7:
        required: false
      PUSHOVER_USER_KEY_8:
        required: false
      PUSHOVER_USER_KEY_9:
        required: false
      PUSHOVER_USER_KEY_10:
        required: false

# Least-privilege: NO workflow-level grants (S8233/S8264) — every job declares exactly
# what it needs.
permissions: {}

jobs:
  pack:
    name: Build and pack (manual only)
    # Skipped when the caller supplies an already-tested packages artifact.
    if: ${{ inputs.artifact-name == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # A manual publish takes any ref. Only a commit already on a protected branch (develop, main, a release
      # branch) has passed review and CI, so anything else is refused before it is built. This guards the ref
      # input; the environment's deployment-branch policy is what guards a dispatch from an unprotected branch,
      # since that run uses the branch's own copy of this file.
      - name: Refuse a ref no protected branch contains
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git fetch --quiet --no-tags origin \
            '+refs/heads/develop:refs/remotes/origin/develop' \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          for branch in $(git for-each-ref --format='%(refname)' refs/remotes/origin/develop refs/remotes/origin/main 'refs/remotes/origin/release/*'); do
            if git merge-base --is-ancestor "$sha" "$branch"; then
              echo "$sha is on ${branch#refs/remotes/origin/}; publishing."
              exit 0
            fi
          done
          echo "::error title=Unreviewed ref::$sha is not on develop, main or a release branch. Merge it through a pull request first."
          exit 1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-retry
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: dotnet build --configuration Release --no-restore -p:Version="$VERSION"

      - name: Pack NuGet packages (no rebuild)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # NU5017 false positive for analyzer packages in .NET 10 SDK
          dotnet pack --configuration Release --no-build --output ./packages -p:Version="$VERSION" || true
          ls -la ./packages/*.nupkg
          if [ "$(ls ./packages/*.nupkg 2>/dev/null | wc -l)" -eq 0 ]; then
            echo "ERROR: No packages were created"
            exit 1
          fi

      - name: Upload packages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages-publish-${{ github.run_id }}
          path: ./packages/*.nupkg

  # The tag step needs the release app, whose secrets live in the release-app environment (#1466). Minting
  # its token here, before anything is pushed, fails a run that could not tag BEFORE the packages are
  # public, not after.
  release-app-ready:
    name: Check the release app can tag
    # The release app's secrets live in this environment (develop, main and release/v* only, #1466).
    environment: release-app
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Mint the release app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read

  push:
    name: Push
    needs: [pack, release-app-ready]
    # pack is skipped (not failed) when artifact-name is supplied; run on skip, stop on failure.
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
      id-token: write       # NuGet OIDC trusted publishing
      attestations: write   # nuget-push attests provenance before pushing
    uses: ./.github/workflows/nuget-push.yml
    with:
      version: ${{ inputs.version }}
      artifact-name: ${{ inputs.artifact-name || format('nuget-packages-publish-{0}', github.run_id) }}
    secrets: inherit

  release:
    name: Tag and GitHub release
    # The release app's secrets live in this environment (develop, main and release/v* only, #1466).
    environment: release-app
    needs: [pack, push]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub release creation (only job that needs write); the tag goes through the app
    steps:
      # The release app pushes the tag: the tag ruleset lets only that app create v* tags, and GitHub Actions
      # cannot be a ruleset bypass actor. Workflows: GitHub refuses an app a ref whose commit changes
      # .github/workflows without it.
      - name: Mint the release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Download packages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name || format('nuget-packages-publish-{0}', github.run_id) }}
          path: ./packages

      # Uploaded by nuget-push.yml's push job (same run) after attesting the packages;
      # attached to the GitHub Release below so provenance is verifiable offline too.
      - name: Download attestation bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attestation-bundle-${{ github.run_id }}
          path: ./attestations

      - name: Generate SHA256 Hashes
        run: |
          cd ./packages
          for file in *.nupkg; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Determine Release Type
        id: release_type
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Tag if Missing
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Created tag: $TAG"
          fi

      # Created as a draft, then published in the step below. GitHub only accepts asset uploads
      # while a release is unpublished, and this repository has immutable releases on, so creating
      # it published and attaching files in the same breath is refused:
      #
      #   Cannot upload asset …nupkg.sha256 to an immutable release.
      #
      # The packages were already on NuGet by then, so the run went red after a successful publish
      # (0.2607.0-beta.1) and the release carried no assets. Nothing subscribes to the release event
      # in this repository, so moving the publish into a second step changes which event fires
      # (published rather than prereleased) without stranding a listener.
      - name: Create GitHub Release (draft, so assets can be attached)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ inputs.version }}
          name: ${{ steps.release_type.outputs.prerelease == 'true' && format('Pre-release v{0}', inputs.version) || format('Release v{0}', inputs.version) }}
          generate_release_notes: true
          prerelease: ${{ steps.release_type.outputs.prerelease == 'true' }}
          files: |
            ./packages/*.nupkg
            ./packages/*.sha256
            ./attestations/*
          fail_on_unmatched_files: false
          draft: true

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # The assets are attached by now, so publishing is the last step rather than the first.
          gh release edit "v$VERSION" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "Published release v$VERSION with its assets attached."

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_COUNT=$(ls ./packages/*.nupkg 2>/dev/null | wc -l)
          {
            echo "## Published v$VERSION"
            echo ""
            echo "- **Version**: \`$VERSION\`"
            echo "- **Packages**: $PACKAGE_COUNT"
            echo "- **NuGet**: https://www.nuget.org/packages/SoftwareExtravaganza.Whizbang.Core/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
