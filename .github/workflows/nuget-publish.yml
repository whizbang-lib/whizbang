name: NuGet Publish

# Canonical explicit-version publish pipeline: build + pack at the given version from the given
# ref, push THROUGH nuget-push.yml — the only workflow file trusted by nuget.org's Trusted
# Publishing policy (pushing from any other workflow fails OIDC token exchange with
# "Workflow mismatch for policy") — then create the git tag + GitHub release.
#
# Used by: manual workflow_dispatch, and release-branch-publish.yml (release/v* branch pushes).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.3.0-alpha.26)'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout (branch, tag, or SHA). Defaults to current ref.'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
    secrets:
      PUSHOVER_API_TOKEN:
        required: false
      PUSHOVER_USER_KEY_1:
        required: false
      PUSHOVER_USER_KEY_2:
        required: false
      PUSHOVER_USER_KEY_3:
        required: false
      PUSHOVER_USER_KEY_4:
        required: false
      PUSHOVER_USER_KEY_5:
        required: false
      PUSHOVER_USER_KEY_6:
        required: false
      PUSHOVER_USER_KEY_7:
        required: false
      PUSHOVER_USER_KEY_8:
        required: false
      PUSHOVER_USER_KEY_9:
        required: false
      PUSHOVER_USER_KEY_10:
        required: false

permissions:
  contents: write   # tag + GitHub release creation
  id-token: write   # NuGet OIDC trusted publishing (nuget-push.yml)

jobs:
  pack:
    name: Build & Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-retry
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: dotnet build --configuration Release --no-restore -p:Version="$VERSION"

      - name: Pack NuGet packages (no rebuild)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # NU5017 false positive for analyzer packages in .NET 10 SDK
          dotnet pack --configuration Release --no-build --output ./packages -p:Version="$VERSION" || true
          ls -la ./packages/*.nupkg
          if [ "$(ls ./packages/*.nupkg 2>/dev/null | wc -l)" -eq 0 ]; then
            echo "ERROR: No packages were created"
            exit 1
          fi

      - name: Upload packages artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nuget-packages-publish-${{ github.run_id }}
          path: ./packages/*.nupkg

  push:
    name: Push (Trusted Publishing)
    needs: pack
    uses: ./.github/workflows/nuget-push.yml
    with:
      version: ${{ inputs.version }}
      artifact-name: nuget-packages-publish-${{ github.run_id }}
    secrets: inherit

  release:
    name: Tag & GitHub Release
    needs: [pack, push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Download packages artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: nuget-packages-publish-${{ github.run_id }}
          path: ./packages

      - name: Generate SHA256 Hashes
        run: |
          cd ./packages
          for file in *.nupkg; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Determine Release Type
        id: release_type
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Tag if Missing
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Created tag: $TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: v${{ inputs.version }}
          name: ${{ steps.release_type.outputs.prerelease == 'true' && format('Pre-release v{0}', inputs.version) || format('Release v{0}', inputs.version) }}
          generate_release_notes: true
          prerelease: ${{ steps.release_type.outputs.prerelease == 'true' }}
          files: |
            ./packages/*.nupkg
            ./packages/*.sha256
          fail_on_unmatched_files: false
          draft: false

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_COUNT=$(ls ./packages/*.nupkg 2>/dev/null | wc -l)
          {
            echo "## Published v$VERSION"
            echo ""
            echo "- **Version**: \`$VERSION\`"
            echo "- **Packages**: $PACKAGE_COUNT"
            echo "- **NuGet**: https://www.nuget.org/packages/SoftwareExtravaganza.Whizbang.Core/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
