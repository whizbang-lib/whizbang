# Scratch stress run for #2446 (not for merge): does the net11.0 test host crash with an internal CLR error on a
# GitHub-hosted Windows arm64 runner, or only on the self-hosted one? Each cell builds once, loops the module that
# crashed, then runs the unit suite as CI does, with crash dumps on.
name: Stress 2446 (windows-11-arm)

on:
  push:
    branches: ['stress/2446-win-arm']

permissions: {}

jobs:
  stress:
    name: ra-${{ matrix.runtime-async }} cov-${{ matrix.coverage }}
    runs-on: windows-11-arm
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime-async: [on, off]
        coverage: [on, off]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      RA: ${{ matrix.runtime-async }}
      COV: ${{ matrix.coverage }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-retry
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: |
          $useRa = if ($env:RA -eq 'on') { 'true' } else { 'false' }
          dotnet build Whizbang.slnx -c Release -p:UseRuntimeAsync=$useRa -v q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet --info | Select-String -Pattern 'Version|RID|Host' | Select-Object -First 8

      - name: Loop the module that crashed (100x)
        shell: pwsh
        run: |
          $dll = 'tests/Whizbang.Transports.RabbitMQ.Tests/bin/Release/net11.0/Whizbang.Transports.RabbitMQ.Tests.dll'
          $args2 = @('--crashdump', '--crashdump-type', 'Heap', '--results-directory', "$PWD/TestResults/loop")
          if ($env:COV -eq 'on') { $args2 += @('--coverage', '--coverage-settings', "$PWD/codecoverage.config") }
          $crashes = 0; $fails = 0
          for ($i = 1; $i -le 100; $i++) {
            $out = & dotnet $dll @args2 2>&1 | Out-String
            $rc = $LASTEXITCODE
            if ($rc -ne 0) {
              $fails++
              if ($out -match 'Internal CLR error|0x80131506|-1073741819|didn''t exit gracefully') { $crashes++ }
              Write-Host "iter $i rc=$rc"
              $out -split "`n" | Select-String -Pattern 'Fatal|Internal CLR|at System|at TUnit|exit code' | Select-Object -First 30 | ForEach-Object { Write-Host $_ }
            }
          }
          "loop ra=$env:RA cov=$env:COV: $fails failures, $crashes crash signatures in 100" | Tee-Object -FilePath stress-summary.txt -Append

      - name: Unit suite as CI runs it (3x)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            $p = @('-Mode', 'Unit', '-Configuration', 'Release', '-NoBuild', '-ReportTrx', '-HangDumpTimeout', '10m', '-CrashDumpType', 'Heap', '-Framework', 'net11.0')
            if ($env:COV -eq 'on') { $p += '-ModuleCoverage' }
            pwsh scripts/Run-Tests.ps1 @p *> "unit-$i.log"
            $rc = $LASTEXITCODE
            $crash = (Select-String -Path "unit-$i.log" -Pattern 'Internal CLR error|0x80131506|-1073741819|TEST PROCESS CRASHED' -Quiet)
            "unit run $i ra=$env:RA cov=$env:COV: rc=$rc crash=$crash" | Tee-Object -FilePath stress-summary.txt -Append
            if ($crash) { Select-String -Path "unit-$i.log" -Pattern 'Fatal|Internal CLR|CRASHED|at System|at TUnit' | Select-Object -First 40 | ForEach-Object { Write-Host $_.Line } }
          }

      - name: Upload summary and crash dumps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-2446-ra-${{ matrix.runtime-async }}-cov-${{ matrix.coverage }}
          path: |
            stress-summary.txt
            unit-*.log
            **/TestResults/**/*_crash.dmp
            **/TestResults/**/*_crash.sequence.log
            TestResults/*_crash.dmp
            TestResults/*_crash.sequence.log
          if-no-files-found: ignore
          retention-days: 7
