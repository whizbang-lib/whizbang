# TEMPORARY (#2446): second pass, hardware-error evidence from the win-arm64 runner. Scratch branch only.
name: Stress 2446

on:
  push:
    branches: [stress/2446-clr-crash]

permissions:
  contents: read

concurrency:
  group: stress-2446
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 15
    steps:
      - name: Collect hardware-error and runtime-crash evidence
        shell: pwsh
        continue-on-error: true
        run: |
          $ev = Join-Path $env:RUNNER_TEMP 'evidence2'
          New-Item -ItemType Directory -Force -Path $ev | Out-Null
          $since = [DateTime]'2026-10-01'
          $cs = Get-CimInstance Win32_ComputerSystem; $bios = Get-CimInstance Win32_BIOS; $cpu = Get-CimInstance Win32_Processor
          "Model: $($cs.Manufacturer) $($cs.Model)`nBIOS: $($bios.SMBIOSBIOSVersion) $($bios.ReleaseDate)`nCPU: $($cpu.Name)`nOS: $((Get-CimInstance Win32_OperatingSystem).Version)" | Tee-Object "$ev\machine.txt" | Write-Host
          $queries = [ordered]@{
            'whea'          = @{ LogName = 'System'; ProviderName = 'Microsoft-Windows-WHEA-Logger'; StartTime = $since }
            'system-errors' = @{ LogName = 'System'; Level = 1, 2; StartTime = [DateTime]'2026-11-18' }
            'kernel-power'  = @{ LogName = 'System'; ProviderName = 'Microsoft-Windows-Kernel-Power'; Id = 41; StartTime = $since }
            'dotnet-1023'   = @{ LogName = 'Application'; ProviderName = '.NET Runtime'; Id = 1023, 1025, 1026; StartTime = $since }
            'app-error'     = @{ LogName = 'Application'; ProviderName = 'Application Error'; Id = 1000; StartTime = $since }
            'wer-1001'      = @{ LogName = 'Application'; ProviderName = 'Windows Error Reporting'; Id = 1001; StartTime = $since }
          }
          foreach ($name in $queries.Keys) {
            try {
              $e = Get-WinEvent -FilterHashtable $queries[$name] -ErrorAction Stop
              $e | Select-Object TimeCreated, Id, ProviderName, LevelDisplayName, Message | Format-List | Out-File "$ev\$name.txt" -Width 400
              Write-Host "$name : $($e.Count)"
              $e | Group-Object { $_.TimeCreated.ToString('yyyy-MM-dd') } | Sort-Object Name | ForEach-Object { "  $($_.Name) $($_.Count)" } | Write-Host
            } catch { Write-Host "$name : $($_.Exception.Message)" }
          }
          foreach ($root in 'C:\ProgramData\Microsoft\Windows\WER\ReportArchive', 'C:\ProgramData\Microsoft\Windows\WER\ReportQueue') {
            Get-ChildItem $root -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'Kernel_*' -or $_.Name -like '*LiveKernel*' } |
              Select-Object -First 10 | ForEach-Object {
                Get-ChildItem $_.FullName -File | Where-Object { $_.Extension -ne '.dmp' -and $_.Length -lt 5MB } |
                  ForEach-Object { Copy-Item $_.FullName (Join-Path $ev ("{0}-{1}" -f $_.Directory.Name, $_.Name)) -ErrorAction SilentlyContinue }
              }
          }
          Get-ChildItem 'C:\Windows\LiveKernelReports' -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, LastWriteTime, Length |
            Format-Table -AutoSize | Out-File "$ev\livekernelreports.txt" -Width 400
          Get-ChildItem $ev | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-2446-evidence2
          path: ${{ runner.temp }}/evidence2
          if-no-files-found: warn
          retention-days: 14
