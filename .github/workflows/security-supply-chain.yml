name: "Supply Chain Security"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 8 * * 2'  # Weekly on Tuesday at 8 AM UTC
  workflow_dispatch:

jobs:
  scan:
    name: OSV Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup .NET
      uses: ./.github/actions/setup-dotnet-retry
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies to generate lockfile
      run: dotnet restore

    - name: Install and Run OSV Scanner
      run: |
        # Pinned, checksum-verified release binary (githubactions:S8545): `go install @version`
        # still resolves transitive modules unpredictably; downloading the official release
        # artifact and verifying its SHA-256 makes the toolchain byte-reproducible — table
        # stakes for the very workflow that guards the supply chain.
        # Pinned within v1 — v2 renames the subcommand to `scan source`, a separate migration.
        curl -sSL -o osv-scanner \
          https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64
        echo "d6af4b67fa5de658598bd2d445efb99e90d1734b3146962418719c4350ecb74b  osv-scanner" | sha256sum -c -
        chmod +x osv-scanner
        ./osv-scanner scan --recursive --format=sarif --output=osv-results.sarif . || echo "No vulnerabilities found"

    - name: Upload SARIF results
      if: always()
      uses: github/codeql-action/upload-sarif@6bc82e05fd0ea64601dd4b465378bbcf57de0314 # v4.32.1
      with:
        sarif_file: osv-results.sarif
        category: supply-chain
