name: "OSSF Scorecard"

on:
  # Note: OSSF Scorecard only works on the default branch
  # Push trigger removed because 'main' is not the default branch (develop is)
  # branch_protection_rule:  # Disabled - requires default branch
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

# Permissions are defined at job level for least-privilege principle
# See: https://docs.github.com/en/actions/security-guides/automatic-token-authentication

# The repository default is read-only; stated here so no job can silently gain more.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run OSSF Scorecard
      uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
      with:
        results_file: scorecard-results.sarif
        results_format: sarif
        publish_results: true

    - name: Upload SARIF results
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: scorecard-results.sarif
        category: ossf-scorecard

    - name: Upload results as artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: OSSF Scorecard Results
        path: scorecard-results.sarif
        retention-days: 5
