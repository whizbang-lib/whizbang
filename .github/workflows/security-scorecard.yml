name: "OSSF Scorecard"

on:
  # Note: OSSF Scorecard only works on the default branch
  # Push trigger removed because 'main' is not the default branch (develop is)
  # branch_protection_rule:  # Disabled - requires default branch
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

# Permissions are defined at job level for least-privilege principle
# See: https://docs.github.com/en/actions/security-guides/automatic-token-authentication

# The repository default is read-only; stated here so no job can silently gain more.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run OSSF Scorecard
      uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
      with:
        results_file: scorecard-results.sarif
        results_format: sarif
        publish_results: true

    - name: Upload SARIF results
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: scorecard-results.sarif
        category: ossf-scorecard

    - name: Upload results as artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: OSSF Scorecard Results
        path: scorecard-results.sarif
        retention-days: 5
