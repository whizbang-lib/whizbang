name: "OSSF Scorecard"

on:
  # Note: OSSF Scorecard only works on the default branch
  # Push trigger removed because 'main' is not the default branch (develop is)
  # branch_protection_rule:  # Disabled - requires default branch
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

# Permissions are defined at job level for least-privilege principle
# See: https://docs.github.com/en/actions/security-guides/automatic-token-authentication

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run OSSF Scorecard
      uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
      with:
        results_file: scorecard-results.sarif
        results_format: sarif
        publish_results: true

    - name: Upload SARIF results
      uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        sarif_file: scorecard-results.sarif
        category: ossf-scorecard

    - name: Upload results as artifact
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: OSSF Scorecard Results
        path: scorecard-results.sarif
        retention-days: 5
