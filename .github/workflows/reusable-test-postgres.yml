name: PostgreSQL Integration Tests (Reusable)

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Build artifact to download (enables -NoBuild with coverage)'
        type: string
        required: false

jobs:
  postgres-tests:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-retry
        with:
          dotnet-version: '10.0.x'

      - name: Download Build Artifacts
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}

      # Overlay the instrumented assemblies on top of the clean build output. Same relative
      # paths, so these replace their clean twins in the test projects' bin dirs — which is
      # what the test hosts load. Instrumentation now happens once in the build job rather
      # than ~11 minutes in every one of these jobs.
      - name: Download Instrumented Assemblies
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-instrumented-${{ github.run_id }}

      - name: Cache NuGet packages
        if: inputs.artifact-name == ''
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        if: inputs.artifact-name == ''
        run: dotnet restore

      - name: Build Solution
        if: inputs.artifact-name == ''
        run: dotnet build --no-restore --configuration Release -maxcpucount:1

      - name: Install dotnet-coverage
        if: inputs.artifact-name != ''
        run: dotnet tool install --global dotnet-coverage

      # Assemblies arrive already instrumented from the build job — see reusable-build.yml.
      # This step only names the session the instrumented bits were stamped with, so the
      # collector below answers to it. The id must match build's EXACTLY: a mismatch is
      # silent, tests pass, and the coverage file comes out empty.
      - name: Name the coverage session
        if: inputs.artifact-name != ''
        run: echo "SESSION_ID=coverage-${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Start Coverage Collection Server
        if: inputs.artifact-name != ''
        run: |
          echo "Starting coverage collection server with session: $SESSION_ID"
          mkdir -p TestResults
          dotnet-coverage collect --session-id "$SESSION_ID" --server-mode --background \
            -f cobertura -o TestResults/postgres.cobertura.xml

      - name: Run PostgreSQL Integration Tests (with pre-built coverage)
        if: inputs.artifact-name != ''
        run: pwsh scripts/Run-Tests.ps1 -Mode Integration -Configuration Release -Tag Postgres -NoBuild -ReportTrx
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'false'

      - name: Run PostgreSQL Integration Tests (with dynamic coverage)
        if: inputs.artifact-name == ''
        run: pwsh scripts/Run-Tests.ps1 -Mode Integration -Coverage -Configuration Release -Tag Postgres -ReportTrx
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'false'

      - name: Shutdown Coverage Collection
        if: inputs.artifact-name != ''
        run: |
          echo "Shutting down coverage collection session: $SESSION_ID"
          dotnet-coverage shutdown "$SESSION_ID" || true
          echo "=== Coverage file contents ==="
          ls -la TestResults/ || true

      - name: Upload TRX Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trx-postgres
          path: |
            tests/**/TestResults/*.trx
            samples/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Coverage (pre-built)
        if: success() && inputs.artifact-name != ''
        uses: actions/upload-artifact@v6
        with:
          name: coverage-postgres
          path: TestResults/*.cobertura.xml
          retention-days: 1

      - name: Upload Coverage (dynamic)
        if: success() && inputs.artifact-name == ''
        uses: actions/upload-artifact@v6
        with:
          name: coverage-postgres
          path: 'tests/**/TestResults/*.cobertura.xml'
          retention-days: 1
