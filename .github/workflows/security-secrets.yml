name: "Secret Scanning"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# The repository default is read-only; stated here so no job can silently gain more.
permissions:
  contents: read

jobs:
  scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # Gitleaks (MIT) replaced TruffleHog (AGPL-3.0), which dependency review refused. It runs as the
    # release binary, not gitleaks/gitleaks-action, which needs a paid license key in an organization
    # repository. The binary is pinned by version and by the SHA-256 the release publishes in
    # gitleaks_<version>_checksums.txt, hard-coded here so a replaced release asset fails the download.
    # To update: bump both values together from the new release's checksums file.
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  # gitleaks_8.30.1_linux_x64.tar.gz

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Full history for comprehensive scanning
        persist-credentials: false

    - name: Install Gitleaks
      run: |
        set -euo pipefail
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        dir="$RUNNER_TEMP/gitleaks"
        mkdir -p "$dir"
        curl -sSfL --retry 3 --proto '=https' --proto-redir '=https' -o "$dir/$archive" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
        echo "${GITLEAKS_SHA256}  $dir/$archive" | sha256sum --check --strict
        tar -xzf "$dir/$archive" -C "$dir" gitleaks
        echo "$dir" >> "$GITHUB_PATH"

    # Every commit of every branch and tag the checkout fetched (gitleaks git's default log options are
    # --all --full-history), not only what this push or pull request adds. Findings are printed with the
    # secret redacted, and any finding fails the job. Gitleaks does not verify a credential against its
    # provider the way TruffleHog --only-verified did, so placeholders can match: the reviewed exceptions
    # are in .github/gitleaks.toml (exact values) and .github/gitleaksignore (single historical findings).
    # --ignore-gitleaks-allow: an inline gitleaks:allow comment cannot silence a finding.
    - name: Scan the full history
      run: |
        gitleaks version
        gitleaks git \
          --config .github/gitleaks.toml \
          --gitleaks-ignore-path .github/gitleaksignore \
          --ignore-gitleaks-allow \
          --redact \
          --verbose \
          --no-banner \
          --no-color \
          .
