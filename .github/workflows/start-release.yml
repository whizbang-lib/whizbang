name: Start Release

run-name: >-
  Release · cut · ${{ inputs.release_type == 'manual' && format('manual v{0}', inputs.manual_version) || inputs.release_type }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto       # Use GitVersion calculated version
          - major      # Force major version bump (x.0.0)
          - minor      # Force minor version bump (0.x.0)
          - patch      # Force patch version bump (0.0.x)
          - manual     # Use manually specified version
      manual_version:
        description: 'Manual version (only used when release_type is "manual", e.g., 1.2.3 or 1.2.3-beta.1)'
        required: false
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    name: Cut · Create the release branch and PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Install GitVersion
        if: inputs.release_type != 'manual'
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: '6.2.x'

      - name: Determine Base Version
        if: inputs.release_type != 'manual'
        id: gitversion
        run: |
          OUTFILE="${RUNNER_TEMP}/gitversion.json"
          dotnet-gitversion /config GitVersion.yml /output file /outputfile "$OUTFILE"
          sed -i '1s/^\xEF\xBB\xBF//' "$OUTFILE"
          SEMVER=$(jq -r '.SemVer' "$OUTFILE")
          FULLSEMVER=$(jq -r '.FullSemVer' "$OUTFILE")
          MAJOR=$(jq -r '.Major' "$OUTFILE")
          MINOR=$(jq -r '.Minor' "$OUTFILE")
          PATCH=$(jq -r '.Patch' "$OUTFILE")
          echo "semVer=$SEMVER" >> $GITHUB_OUTPUT
          echo "fullSemVer=$FULLSEMVER" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Fallback Version (if GitVersion fails)
        if: inputs.release_type != 'manual' && steps.gitversion.outcome == 'failure'
        id: fallback
        run: |
          echo "::warning::GitVersion failed, using fallback version from Directory.Build.props"
          # Extract current version from Directory.Build.props
          CURRENT_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
          if [[ "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "major=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "minor=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
            echo "patch=$((${BASH_REMATCH[3]} + 1))" >> $GITHUB_OUTPUT
            echo "preReleaseTag=fallback" >> $GITHUB_OUTPUT
          else
            # Last resort defaults
            echo "major=0" >> $GITHUB_OUTPUT
            echo "minor=9" >> $GITHUB_OUTPUT
            echo "patch=99" >> $GITHUB_OUTPUT
            echo "preReleaseTag=fallback" >> $GITHUB_OUTPUT
          fi

      - name: Calculate Final Version
        id: version
        env:
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          INPUT_MANUAL_VERSION: ${{ inputs.manual_version }}
        run: |
          if [ "$INPUT_RELEASE_TYPE" = "manual" ]; then
            # Use manually specified version
            MANUAL_VER="$INPUT_MANUAL_VERSION"
            if [ -z "$MANUAL_VER" ]; then
              echo "::error::Manual version is required when release_type is 'manual'"
              exit 1
            fi
            # Validate version format (basic semver check)
            # A release branch is always a stable number: its beta and rc prereleases are published
            # from the branch (release-prerelease.yml), never cut as branches of their own.
            if ! echo "$MANUAL_VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Invalid version format. Expected x.y.z. Prereleases are published from the release branch (Actions → Release Prerelease), not cut as their own branch."
              exit 1
            fi
            SEMVER="$MANUAL_VER"
          else
            # Use GitVersion outputs, or fallback if it failed
            if [ "${{ steps.gitversion.outcome }}" == "failure" ]; then
              MAJOR=${{ steps.fallback.outputs.major }}
              MINOR=${{ steps.fallback.outputs.minor }}
              PATCH=${{ steps.fallback.outputs.patch }}
              echo "::warning::Using fallback version values"
            else
              MAJOR=${{ steps.gitversion.outputs.major }}
              MINOR=${{ steps.gitversion.outputs.minor }}
              PATCH=${{ steps.gitversion.outputs.patch }}
            fi
            case "$INPUT_RELEASE_TYPE" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
              auto)
                # Use GitVersion's calculated version as-is
                ;;
            esac

            BASE="${MAJOR}.${MINOR}.${PATCH}"
            TAGS=$(git tag -l 'v*')
            HIGHEST_STABLE=$(sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' <<< "$TAGS" | sort -V | tail -1)

            # AN OPEN SERIES PINS ITS NUMBER. Once vX.Y.Z-beta.1 is tagged, GitVersion moves past
            # X.Y.Z (verified: with v0.2451.0-beta.1 as the highest tag, auto computes 0.2452.0). If
            # that release is abandoned and re-cut, auto must offer X.Y.Z again, not skip it. An open
            # series is the highest X.Y.Z with beta/rc tags, no stable tag, above the highest stable.
            OPEN=""
            while read -r v; do
              [ -z "$v" ] && continue
              grep -qx "v$v" <<< "$TAGS" && continue
              if [ -n "$HIGHEST_STABLE" ] && [ "$(printf '%s\n%s\n' "$HIGHEST_STABLE" "$v" | sort -V | tail -1)" = "$HIGHEST_STABLE" ]; then
                continue
              fi
              OPEN="$v"
            done <<< "$(sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)-(beta|rc)\.[0-9]+$/\1/p' <<< "$TAGS" | sort -uV)"
            if [ -n "$OPEN" ] && [ "$INPUT_RELEASE_TYPE" = auto ]; then
              echo "::notice::v$OPEN has prereleases but never shipped stable. This cut continues it instead of GitVersion's $BASE."
              BASE="$OPEN"
            elif [ -n "$OPEN" ]; then
              echo "::warning::v$OPEN has prereleases but never shipped stable; release_type=$INPUT_RELEASE_TYPE starts $BASE instead and leaves it behind."
            fi
            SEMVER="$BASE"
            if grep -qx "v$SEMVER" <<< "$TAGS"; then
              echo "::error::v$SEMVER is already tagged."
              exit 1
            fi
          fi

          echo "semver=$SEMVER" >> $GITHUB_OUTPUT
          echo "branch=release/v$SEMVER" >> $GITHUB_OUTPUT
          echo "Calculated version: $SEMVER"

      - name: One release in flight at a time
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          # Gitflow keeps a single release branch open: its prereleases, fixes and final merge all
          # happen there. A second cut would race the first for the same main.
          OPEN_PR=$(gh pr list --repo "$REPO" --base main --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release/v"))][0] // empty | "#\(.number) \(.headRefName)"')
          if [ -n "$OPEN_PR" ]; then
            echo "::error::Release PR $OPEN_PR is still open. Merge it (ship) or close it (abandon) before cutting another."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "::error::$BRANCH already exists. Delete it if that cut was abandoned, then retry."
            exit 1
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Release Branch
        run: |
          BRANCH="${{ steps.version.outputs.branch }}"
          git checkout -b "$BRANCH"

      - name: Merge main into the release branch
        run: |
          # Bring main into the release branch BEFORE opening the PR so the release PR is
          # conflict-free. main carries the PREVIOUS release's version in Directory.Build.props
          # while develop keeps its local placeholder, so main and develop have diverged — and
          # without this, every release PR conflicts on that one file (both sides changed the
          # <Version> line from their shared base). We resolve that EXPECTED props conflict (the
          # version is re-stamped in the next step regardless); any OTHER conflict is unexpected
          # and fails loudly rather than being silently dropped.
          git fetch origin main
          if git merge origin/main --no-edit -m "chore: merge main into release branch before release"; then
            echo "Merged main cleanly (nothing to reconcile or already contained)."
          else
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            if [ "$CONFLICTS" = "Directory.Build.props" ]; then
              echo "Resolving the expected Directory.Build.props version conflict."
              git checkout --ours -- Directory.Build.props
              git add Directory.Build.props
              git commit --no-edit
            else
              echo "::error::Unexpected merge conflict beyond Directory.Build.props:"
              echo "$CONFLICTS"
              git merge --abort
              exit 1
            fi
          fi

      - name: Update Version in Directory.Build.props
        run: |
          VERSION="${{ steps.version.outputs.semver }}"
          echo "Updating version to: $VERSION"

          # Update the version in Directory.Build.props using sed
          sed -i "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|g" Directory.Build.props

          # Verify the change
          grep "<Version>" Directory.Build.props

      - name: Commit and Push
        run: |
          VERSION="${{ steps.version.outputs.semver }}"
          BRANCH="${{ steps.version.outputs.branch }}"

          git add Directory.Build.props
          git commit -m "chore(release): bump version to $VERSION"
          git push origin "$BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          VERSION="${{ steps.version.outputs.semver }}"
          BRANCH="${{ steps.version.outputs.branch }}"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): v$VERSION" \
            --label "release" \
            --label "automated" \
            --body "$(cat <<'EOF'
          ## Release v${{ steps.version.outputs.semver }}

          This PR prepares the release of version **v${{ steps.version.outputs.semver }}**.

          ### Changes
          - Updated `Directory.Build.props` to version `${{ steps.version.outputs.semver }}`

          ### Release Checklist
          - [ ] All CI checks pass
          - [ ] Version number is correct
          - [ ] CHANGELOG updated (if applicable)

          ### After Merge
          When this PR is merged to `main`, the release workflow will:
          1. Create git tag `v${{ steps.version.outputs.semver }}`
          2. Create GitHub Release with auto-generated notes
          3. Publish NuGet packages

          ---
          *This PR was automatically created by the Start Release workflow.*
          EOF
          )"

      - name: Summary
        run: |
          echo "## Release PR Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: v${{ steps.version.outputs.semver }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ steps.version.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: Created and ready for review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Once the PR is approved and merged, the release will be automatically published." >> $GITHUB_STEP_SUMMARY
