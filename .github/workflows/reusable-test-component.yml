name: Component Tests (Reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Where the job runs, as JSON: a label ("ubuntu-latest") or a label set (["self-hosted","whizbang","Linux","X64"]).
          CI passes the runner picker's choice (.github/scripts/Select-CiRunner.ps1); every other caller gets ubuntu-latest.
        type: string
        required: false
        default: '"ubuntu-latest"'
      artifact-name:
        description: 'Build artifact to download (enables -NoBuild with coverage)'
        type: string
        required: false
      frameworks:
        description: >-
          The target frameworks the build tested, as a JSON array (Build · Compile's test-frameworks). Each runs as its
          own leg with Run-Tests.ps1 -Framework: net10.0 and net11.0 on a release build, net11.0 alone otherwise.
          Empty: one leg testing every framework the build targets.
        type: string
        required: false
        default: ''
      coverage-framework:
        description: >-
          The one target framework coverage is measured on (Build · Compile's coverage-framework, net11.0). Only that
          framework's leg collects and uploads coverage; the other legs run their tests without it (#2135). Empty: every
          leg collects.
        type: string
        required: false
        default: ''

# Component-type projects (#1264): real workers and threads in one process, no external
# infrastructure. Every interleaving is fixed by the test through signals, and every asynchronous
# assertion waits on the signal for the exact transition it asserts. Run-Tests.ps1 -Mode Component
# selects every project declaring <WhizbangTestType>Component</WhizbangTestType>, and the build job
# uploads exactly those projects as this suite's slice (.github/scripts/Get-TestSlice.ps1).

# The repository default is read-only; stated here so no job can silently gain more.
permissions:
  contents: read

jobs:
  component-tests:
    # One leg per framework (#2427). With more than one (a release build) each leg is named for its framework and
    # suffixes its artifacts with it, so the legs never collide; one leg keeps the plain name and artifact names.
    name: ${{ strategy.job-total > 1 && format('Run suite ({0})', matrix.framework) || 'Run suite' }}
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(inputs.frameworks || '[""]') }}
    env:
      FRAMEWORK_SUFFIX: ${{ strategy.job-total > 1 && format('-{0}', matrix.framework) || '' }}
      # Whether this leg measures coverage: the coverage framework's leg, or every leg when none is named (#2135).
      COVERAGE_LEG: ${{ inputs.coverage-framework == '' || matrix.framework == '' || matrix.framework == inputs.coverage-framework }}
    runs-on: ${{ fromJSON(inputs.runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 20

    steps:
      # This job may run on any OS, on a GitHub-hosted runner or a team machine that is not wiped
      # between jobs (.github/WORKFLOWS.md, "Runner selection"). The checkout's default clean
      # (git clean -ffdx) removes the previous job's downloaded build and TestResults first, so no
      # earlier report can be counted or uploaded here. Every step below is pwsh or an action.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-retry
        with:
          dotnet-version: '10.0.x'

      - name: Download Build Artifacts
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}

      # The build's coverage source-root mappings name the build machine's checkout; a runner that
      # checked out anywhere else would collect empty reports. Point them here.
      - name: Point coverage at this checkout
        if: inputs.artifact-name != ''
        shell: pwsh
        run: ./.github/scripts/Update-CoverageSourceRoots.ps1

      - name: Cache NuGet packages
        if: inputs.artifact-name == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.*.props') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-

      - name: Restore Dependencies
        if: inputs.artifact-name == ''
        shell: pwsh
        run: dotnet restore --locked-mode

      - name: Build Solution
        if: inputs.artifact-name == ''
        shell: pwsh
        run: dotnet build --no-restore --configuration Release -maxcpucount:1

      - name: Run Component Tests (pre-built)
        if: inputs.artifact-name != ''
        shell: pwsh
        run: pwsh scripts/Run-Tests.ps1 -Mode Component -Configuration Release -NoBuild -ModuleCoverage -ReportTrx -HangDumpTimeout 10m -CrashDumpType Heap -Framework '${{ matrix.framework }}' -CoverageFramework '${{ inputs.coverage-framework }}'

      - name: Run Component Tests (built here)
        if: inputs.artifact-name == ''
        shell: pwsh
        run: pwsh scripts/Run-Tests.ps1 -Mode Component -ModuleCoverage -Configuration Release -ReportTrx -HangDumpTimeout 10m -CrashDumpType Heap -Framework '${{ matrix.framework }}' -CoverageFramework '${{ inputs.coverage-framework }}'

      # A module with no test activity for the hang dump timeout above prints the tests still running, writes
      # <process>_<pid>_hang.dmp and the test list <process>_<pid>_hang.log (the process is `dotnet` under
      # `dotnet test`) and is killed, so the run fails with time left to upload them (#2402).
      # Since Testing Platform 2.5 they land in TestResults under `dotnet test`'s working directory, which
      # Run-Tests.ps1 sets to the repository root; the module globs cover a module run on its own.
      # Canceled too: a dump taken just before the job limit is still kept.
      - name: Upload hang dumps
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hangdump-component${{ env.FRAMEWORK_SUFFIX }}-${{ github.run_attempt }}
          path: |
            TestResults/*_hang.dmp
            TestResults/*_hang.log
            tests/**/TestResults/*_hang.dmp
            tests/**/TestResults/*_hang.log
            samples/**/TestResults/*_hang.dmp
            samples/**/TestResults/*_hang.log
          if-no-files-found: ignore
          retention-days: 7

      # A module whose process the runtime kills (an internal CLR error, an access violation, a FailFast) writes
      # <module>_<pid>_crash.dmp and the tests still running, <module>_<id>_crash.sequence.log, beside the hang
      # dumps (Run-Tests.ps1 -CrashDumpType above), so a crash leaves a dump to analyze, not only an exit code (#2446).
      - name: Upload crash dumps
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crashdump-component${{ env.FRAMEWORK_SUFFIX }}-${{ github.run_attempt }}
          path: |
            TestResults/*_crash.dmp
            TestResults/*_crash.sequence.log
            tests/**/TestResults/*_crash.dmp
            tests/**/TestResults/*_crash.sequence.log
            samples/**/TestResults/*_crash.dmp
            samples/**/TestResults/*_crash.sequence.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload TRX Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trx-component${{ env.FRAMEWORK_SUFFIX }}
          path: |
            tests/**/TestResults/*.trx
            samples/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 1

      # An empty report (`<packages />`) is what the collector writes when it skipped every assembly,
      # and the tests still pass, so the upload alone cannot tell it from real coverage. Warns per
      # empty report and fails when the whole leg measured nothing (.github/scripts/Test-CoverageCollected.ps1).
      - name: Verify coverage was collected
        if: success() && env.COVERAGE_LEG == 'true'
        shell: pwsh
        run: ./.github/scripts/Test-CoverageCollected.ps1

      # Coverage: each test module collects its own with Microsoft.Testing.Platform's dynamic
      # collector (Run-Tests.ps1 -ModuleCoverage), which records branches as well as lines.
      # The statically instrumented assemblies this job used to overlay recorded lines only, so
      # every report claimed full branch coverage with no conditions behind it. Each module
      # writes <guid>.cobertura.xml under its own bin/Release/<framework>/TestResults, so parallel
      # modules and shards never collide when the quality job flattens the artifacts.
      # The direct child of TestResults is the report; the copy TRX attaches below it is not
      # matched, so nothing is counted twice.
      - name: Upload Coverage
        if: success() && env.COVERAGE_LEG == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-component${{ env.FRAMEWORK_SUFFIX }}
          path: |
            tests/**/TestResults/*.cobertura.xml
            samples/**/TestResults/*.cobertura.xml
            tests/**/TestResults/*.coverage
            samples/**/TestResults/*.coverage
          # A leg that ran tests but wrote no report would otherwise upload nothing and leave the
          # quality job to time out waiting for it; fail here, where the cause is.
          if-no-files-found: error
          retention-days: 1
