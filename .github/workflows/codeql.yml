name: "CodeQL"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    paths-ignore:      # a markdown-only change cannot alter the C# attack surface
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # build-mode: none extracts from source instead of tracing a compile, which removes the
    # third full build of the run. The traced build was 1758s of a 2489s job (70.6%) — and
    # 2.4x slower than the ordinary build, because the tracer wraps the compiler.
    #
    # What this gives up: generated code is no longer analyzed. That is a deliberate trade
    # rather than an oversight — this repo is ~17.7k generated .g.cs against ~1.5k
    # hand-written files, but the generators that emit them ARE hand-written and still get
    # analyzed, so a flaw reaches the report through its source rather than its output.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        languages: ${{ matrix.language }}
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
