name: Git Flow Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-branch-direction:
    name: Gate · Gitflow branch direction
    runs-on: ubuntu-latest

    steps:
      - name: Check Git Flow Rules
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking PR #$PR_NUMBER"
          echo "Source branch: $HEAD_REF"
          echo "Target branch: $BASE_REF"
          echo ""

          # Define allowed patterns
          # Format: "source_pattern:target_pattern"
          # The supported flows, and only these (docs/RELEASING.md → "Supported flows"):
          ALLOWED_PATTERNS=(
            # Everyday work → develop (merge queue; develop publishes the alpha channel)
            "feature/*:develop"
            "feat/*:develop"
            "fix/*:develop"
            "bugfix/*:develop"
            "hotfix/*:develop"
            "chore/*:develop"
            "docs/*:develop"
            "plan/*:develop"
            "refactor/*:develop"
            "test/*:develop"
            "perf/*:develop"
            "ci/*:develop"
            "build/*:develop"
            "style/*:develop"
            "dependabot/*:develop"

            # Stabilization of an open release: a fix lands on the release branch (and so in its
            # next beta/rc), then reaches develop through the release's own back-merge
            "fix/*:release/v*"
            "bugfix/*:release/v*"
            "hotfix/*:release/v*"

            # The release itself: only a release branch ever targets main
            "release/v*:main"

            # Automated back-merges into develop (after a release, or an older-line hotfix)
            "sync/*:develop"
          )

          # Function to check if source matches pattern
          matches_pattern() {
            local value="$1"
            local pattern="$2"

            # Convert glob pattern to regex
            local regex="^${pattern//\*/.*}$"
            [[ "$value" =~ $regex ]]
          }

          # Check if this PR matches any allowed pattern
          VALID=false
          MATCHED_PATTERN=""

          for pattern in "${ALLOWED_PATTERNS[@]}"; do
            SOURCE_PATTERN="${pattern%%:*}"
            TARGET_PATTERN="${pattern##*:}"

            if matches_pattern "$HEAD_REF" "$SOURCE_PATTERN" && matches_pattern "$BASE_REF" "$TARGET_PATTERN"; then
              VALID=true
              MATCHED_PATTERN="$pattern"
              break
            fi
          done

          if [ "$VALID" = true ]; then
            echo "✅ Valid Git Flow direction: $HEAD_REF → $BASE_REF"
            echo "   Matched pattern: $MATCHED_PATTERN"
            exit 0
          fi

          # Invalid - provide helpful error message
          echo ""
          echo "❌ INVALID BRANCH DIRECTION"
          echo ""
          echo "   $HEAD_REF → $BASE_REF is not allowed by Git Flow rules."
          echo ""

          # Provide specific guidance based on branch type
          if [[ "$HEAD_REF" == feature/* ]] || [[ "$HEAD_REF" == feat/* ]] || [[ "$HEAD_REF" == fix/* ]]; then
            echo "📌 Feature/fix branches must merge into 'develop', not '$BASE_REF'."
            echo ""
            echo "   To fix this PR:"
            echo "   1. Close this PR"
            echo "   2. Create a new PR targeting 'develop'"
            echo ""
            echo "   Or change the base branch in the PR settings above."

          elif [[ "$HEAD_REF" == release/* ]] && [[ "$BASE_REF" == develop ]]; then
            echo "📌 Release branches merge into 'main', not 'develop'."
            echo ""
            echo "   After the release publishes, a sync/* PR brings its changes back to develop."

          elif [[ "$HEAD_REF" == develop ]] && [[ "$BASE_REF" == main ]]; then
            echo "📌 Don't merge 'develop' directly into 'main'."
            echo ""
            echo "   Use the release workflow instead:"
            echo "   1. Go to Actions → Start Release"
            echo "   2. Run the workflow to create a release branch"
            echo "   3. The workflow will create a proper release PR"

          elif [[ "$BASE_REF" == main ]]; then
            echo "📌 Only a release/vX.Y.Z branch may target 'main'."
            echo ""
            echo "   A hotfix ships as its own release branch: branch release/vX.Y.Z from the tag it"
            echo "   patches, push, then commit the fix. See docs/RELEASING.md → Hotfixes."

          else
            echo "📌 This branch direction is not recognized."
            echo ""
            echo "   Supported directions:"
            echo "   • feat/*, fix/*, test/*, ci/*, ... → develop"
            echo "   • fix/*, bugfix/*, hotfix/* → release/vX.Y.Z   (stabilizing an open release)"
            echo "   • release/vX.Y.Z → main"
            echo "   • sync/* → develop   (automated back-merges)"
          fi

          echo ""
          echo "📚 Supported flows:"
          echo "   https://github.com/$REPO/blob/develop/docs/RELEASING.md#supported-flows"
          echo ""

          exit 1

      - name: Add PR Comment on Failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const head = context.payload.pull_request.head.ref;
            const base = context.payload.pull_request.base.ref;

            // Check if we already commented
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Git Flow Branch Direction Error')
            );

            if (botComment) {
              // Already commented, don't spam
              return;
            }

            // NOTE: multi-line markdown is built with join('\n') — template-literal
            // continuation lines at column 0 would end the YAML block scalar and make this
            // workflow file unparseable (GitHub then spawns a 0s failed run on every push).
            let suggestion = '';
            if (head.startsWith('feature/') || head.startsWith('feat/') || head.startsWith('fix/')) {
              suggestion = [
                `Feature and fix branches should target \`develop\`, not \`${base}\`.`,
                '',
                '**To fix:** Change the base branch to `develop` using the "Edit" button above.',
              ].join('\n');
            } else if (head.startsWith('release/') && base === 'develop') {
              suggestion = [
                'Release branches should target `main`, not `develop`.',
                '',
                'After merging to main, changes automatically sync back to develop.',
              ].join('\n');
            } else if (head === 'develop' && base === 'main') {
              suggestion = [
                "Don't merge `develop` directly to `main`.",
                '',
                '**Instead:** Use the [Start Release workflow](../../actions/workflows/start-release.yml) to create a proper release.',
              ].join('\n');
            } else {
              suggestion = "This branch direction doesn't match our Git Flow rules.";
            }

            const body = [
              '## ❌ Git Flow Branch Direction Error',
              '',
              `**\`${head}\` → \`${base}\`** is not an allowed branch direction.`,
              '',
              suggestion,
              '',
              '📚 **[Supported flows](../blob/develop/docs/RELEASING.md#supported-flows)**',
              '',
              '---',
              '<sub>This check ensures we follow Git Flow for clean releases. If you believe this is incorrect, please contact a maintainer.</sub>',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
