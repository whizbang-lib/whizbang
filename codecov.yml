coverage:
  # Disable automatic GitHub status checks - we'll check coverage in the workflow
  status:
    project: off
    patch: off

# No PR comment: the PR quality-gate comment (reusable-quality.yml) reports new-line, new-branch and
# whole-library coverage on every run, and Codecov's comment did not reliably refresh after later pushes,
# so it showed stale results next to it. Coverage is still uploaded and visible on codecov.io.
comment: false

ignore:
  - "**/*.Generated.cs"
  - "**/.whizbang/cache/**"
  - "samples/**"
  - "benchmarks/**"
  - "test-diagnostics/**"
  - "src/Whizbang.Testing/Containers/**"
  - "tests/**"
  - "tools/**"
