mode: ContinuousDeployment
branches:
  develop:
    label: alpha
    # Minor (not Patch): develop prereleases compute in the NEXT-MINOR band above the last
    # release tag, so the auto-published develop channel can never collide with (or sort
    # below) a deliberate release. Patch-band versions are reserved for hotfix/bugfix-only
    # releases, which come from release/vX.Y.Z branch names, not GitVersion.
    # See docs/RELEASING.md → "Version increment rules".
    increment: Minor
    track-merge-target: true
    regex: ^develop$
  release:
    label: ''
    increment: Patch
    prevent-increment:
      of-merged-branch: false
    track-merge-target: false
    regex: ^releases?[/-]
    is-release-branch: true
  main:
    label: ''
    increment: Patch
    prevent-increment:
      of-merged-branch: true
    track-merge-target: false
    regex: ^master$|^main$
    is-main-branch: true
  pull-request:
    # GitVersion 6.2 removed `label-number-pattern`. The PR number now comes from a named
    # `Number` capture in `regex`, substituted into `label` by the {Number} placeholder.
    # Verified identical to GitVersion 6.1 with the old key, on develop, main, the release
    # branch and a pull/N/merge ref (compare with /nocache -- GitVersion caches per commit sha,
    # so without it every branch returns the first result and the comparison looks like a match).
    label: pr{Number}
    increment: Inherit
    regex: ^(pull-requests|pull|pr)[/-](?<Number>\d*)
